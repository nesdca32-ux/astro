  html += `<section class="sec"><h3>บทบาทของคุณในทีม</h3><p class="lead-l"><b>${r.n}</b> ที่${ROLE_MOD[P.mod]}</p><p>ธาตุ${ELEM[P.el].n}เด่นที่สุดในดวงของคุณ ในทีมคุณจึงมักเป็นคน${r.d} และด้วยพลังแบบ${MODS[P.mod].n} คุณ${ROLE_MOD[P.mod]}</p>`;
  html += `<dl class="dl"><dt>จังหวะการทำงาน</dt><dd>${PACE[ms.el]} (${lk('planets','pl-mars',`ดาวอังคารราศี${ms.th}`)})</dd><dt>การสื่อสาร</dt><dd>${COMM[mc.el]} (${lk('planets','pl-mercury',`ดาวพุธราศี${mc.th}`)})</dd>`;
  if (ch.cusps) {
    const s6 = signOf(ch.cusps[5]), in6 = PLANETS.filter(p=>ch.houseOf(ch.lons[p.k])===6), s10 = signOf(ch.mc);
    html += `<dt>งานประจำวัน</dt><dd>คุณจัดการงานแต่ละวันแบบ${s6.style} (${lk('houses','ho-6','เรือน 6 ราศี'+s6.th)})${in6.length?` และมี${in6.map(p=>p.th).join(' ')}อยู่ในเรือนงาน ${in6.map(p=>PH[p.k][5]).join(' ')}`:''}</dd>`;
    html += `<dt>ทิศทางอาชีพ</dt><dd>ในอาชีพ คุณอยากเป็นที่รู้จักในฐานะคน${s10.style} (${lk('planets','pl-mc','กลางฟ้าราศี'+s10.th)})</dd>`;
  }
  html += `</dl></section>`;

  html += `<section class="sec"><h3>งานแบบไหนทำคนเดียว งานแบบไหนทำเป็นทีม</h3><div class="tasks">${Object.keys(TASKS).map(el=>{ const v = taskVerdict(P.e[el], el, P.pct);
    return `<div class="task"><div class="task-h"><b>${TASKS[el].t}</b><span class="tag n-${v.c}">${v.v}</span></div><p class="sub">${TASKS[el].d}</p><p>${v.d}</p></div>`; }).join('')}</div></section>`;

  let weak = Object.keys(P.e).filter(k=>P.e[k]<=1);
  if (!weak.length) { const mn = Math.min(...Object.values(P.e)), w2 = Object.keys(P.e).filter(k=>P.e[k]===mn); weak = w2.length<=2 ? w2 : []; }
  const sunEl = signOf(ch.lons.sun).el;
  html += `<section class="sec"><h3>คนแบบไหนเติมเต็มคุณ</h3><ul class="hl good">`;
  if (!weak.length) html += `<li><b>ธาตุในดวงค่อนข้างสมดุล</b> คุณจึงทำงานเข้ากับคนได้หลายแบบ คนที่เติมเต็มคุณได้ดีที่สุดคือคนที่เก่งเฉพาะด้านลึกกว่าคุณในเรื่องที่ทีมต้องการ</li>`;
  html += weak.map(el=>`<li><b>คนที่มีธาตุ${ELEM[el].n}เด่น</b> เช่น มีดวงอาทิตย์ ดวงจันทร์ หรือลัคนาอยู่ราศี${EL_SIGNS[el]} เขาถนัดงานด้าน${TASKS[el].t} ซึ่งเป็นด้านที่คุณต้องใช้แรงมากกว่าคนอื่น</li>`).join('');
  html += `<li><b>จังหวะการทำงานที่เข้ากัน</b> ${MOD_NEED[P.mod]}</li>`;
  html += `<li><b>คนที่คุยกันรู้เรื่องง่าย</b> คนที่มีดวงอาทิตย์หรือดาวพุธอยู่ธาตุ${ELEM[sunEl].n}เหมือนคุณ หรือธาตุ${ELEM[EL_FRIEND[sunEl]].n} (ราศี${EL_SIGNS[EL_FRIEND[sunEl]]}) จะเข้าใจวิธีคิดของคุณได้เร็ว แต่ถ้าเหมือนกันมากไปอาจมีจุดบอดเดียวกัน</li></ul></section>`;

  // เพื่อนร่วมงาน
  const opts = $('place').innerHTML.replace(/<optgroup label="อื่น ๆ">.*?<\/optgroup>/, '');
  html += `<section class="sec" id="team"><h3>เทียบกับเพื่อนร่วมงาน</h3><p class="sub">เพิ่มวันเกิดของคนที่ทำงานด้วย เพื่อดูว่าเข้ากันอย่างไร ควรแบ่งงานกันแบบไหน และงานไหนควรทำด้วยกันหรือแยกกันทำ เพิ่มได้หลายคนเพื่อดูภาพรวมของทั้งทีม</p>
  <form id="mf" class="mform" novalidate>
    <label class="mini">ชื่อ<input id="m-name" type="text" autocomplete="off" placeholder="เช่น นิด"></label>
    <div class="row r3"><label class="mini">วัน<input id="m-day" type="number" inputmode="numeric" min="1" max="31"></label><label class="mini">เดือน<select id="m-month"><option value="">เลือก</option>${MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></label><label class="mini">ปี<input id="m-year" type="number" inputmode="numeric" placeholder="พ.ศ. หรือ ค.ศ."></label></div>
    <div class="row r2"><label class="mini">ชั่วโมง<input id="m-hour" type="number" inputmode="numeric" min="0" max="23"></label><label class="mini">นาที<input id="m-minute" type="number" inputmode="numeric" min="0" max="59"></label></div>
    <label class="check"><input id="m-notime" type="checkbox"> ไม่ทราบเวลาเกิด</label>
    <label class="mini">สถานที่เกิด<select id="m-place">${opts}</select></label>
    <p class="err" id="m-err" role="alert"></p>
    <button class="btn" type="submit">เพิ่มเพื่อนร่วมงาน</button>
  </form>`;
  if (TEAM.length) {
    const rows = [{n:'คุณ', ch, P}].concat(TEAM.map(o=>{ const c = memberChart(o); return {n:o.name, ch:c, P:workProfile(c), o}; }));
    html += `<div class="list" style="margin-top:20px">`;
    rows.slice(1).forEach((m, i)=>{
      const S = synastry(ch, m.ch, me, m.n);
      const good = S.list.filter(x=>x.nature==='e').slice(0,4), hard = S.list.filter(x=>x.nature==='h').slice(0,4);
      const verdict = S.total>=60 ? 'ทำงานด้วยกันได้ดี เหมาะกับโปรเจกต์ร่วมที่ต้องคุยกันบ่อย' : S.total>=45 ? 'ทำงานด้วยกันได้ โดยแบ่งงานตามความถนัดและตกลงวิธีสื่อสารให้ชัด' : 'เหมาะแบ่งงานเป็นส่วนของใครของมัน แล้วนัดรวมงานเป็นระยะ มากกว่าทำงานใกล้ชิดตลอดเวลา';
      const bothSolo = P.pct<45 && m.P.pct<45 ? ' ทั้งคู่ชอบทำคนเดียว ควรแบ่งความรับผิดชอบให้ชัดและลดการประชุมที่ไม่จำเป็น' : (P.pct>55 && m.P.pct>55 ? ' ทั้งคู่ชอบทำเป็นทีม ทำงานใกล้ชิดกันได้สบาย แต่ระวังคุยกันมากจนงานไม่เดิน' : '');
      const split = Object.keys(TASKS).map(el=>{ const a = P.e[el], b = m.P.e[el];
        const t = a>=3&&b>=3 ? 'ถนัดทั้งคู่ ทำด้วยกันได้ดีมาก แต่ระวังจุดบอดเดียวกัน' : a>=3&&a>b ? `ให้คุณเป็นเจ้าของงานนี้ ${m.n}ช่วยเสริม` : b>=3&&b>a ? `ให้${m.n}เป็นเจ้าของงานนี้ คุณช่วยเสริม` : a<=1&&b<=1 ? 'ไม่มีใครถนัด ควรหาคนที่สามมาช่วย หรือเผื่อเวลาให้มากขึ้น' : a>=2&&b<=1 ? `ให้คุณดูแลเป็นหลัก เพราะ${m.n}ไม่ถนัดด้านนี้` : b>=2&&a<=1 ? `ให้${m.n}ดูแลเป็นหลัก เพราะคุณไม่ถนัดด้านนี้` : 'ทำได้ทั้งคู่ จะทำด้วยกันหรือแยกกันก็ได้';
        return `<li><b>${TASKS[el].t}</b> ${t}</li>`; }).join('');
      const sum = `<span class="gl num" style="font-family:var(--display);font-size:18px">${S.total}</span><span><span class="sm-name">${esc(m.n)}</span><span class="tag n-${S.total>=58?'e':S.total>=45?'m':'h'}">${scoreLabel(S.total)}</span><br><span class="sm-sub">${ROLE_EL[m.P.el].n} ${soloLabel(m.P.pct)}</span></span><span class="sm-right"></span>`;
      let body = `<div class="bars" style="max-width:420px">${bar('การสื่อสาร',S.comm)}${bar('จังหวะงาน',S.pace)}${bar('ความไว้ใจ',S.trust)}</div>`;
      body += `<p class="lead-l"><b>${verdict}</b>${bothSolo}</p>`;
      body += `<p><b>แบ่งบทบาท</b> คุณเป็น${ROLE_EL[P.el].n} ส่วน${esc(m.n)}เป็น${ROLE_EL[m.P.el].n}${P.el===m.P.el?' เหมือนกัน จึงเข้าใจกันง่าย แต่ควรมีคนที่สามมาเติมด้านที่ขาด':''} ${S.mp[1]}</p>`;
      body += `<p><b>การสื่อสารและจังหวะ</b> ${S.cr[1]} ${S.pr[1]}</p>`;
      if (S.comp.length) body += `<p><b>เติมเต็มกัน</b> ${S.comp.join(' ')}</p>`;
      body += `<p><b>งานแต่ละประเภท</b></p><ul class="pl">${split}</ul>`;
      if (good.length) body += `<p><b>จุดที่ส่งเสริมกัน</b></p><ul class="hl good">${good.map(x=>`<li><span class="tag n-e">${PK[x.a].th}ของคุณ ${x.asp.n} ${PK[x.b].th}ของ${esc(m.n)}</span> ${esc(x.txt)}</li>`).join('')}</ul>`;
      if (hard.length) body += `<p><b>จุดที่ต้องระวัง</b></p><ul class="hl bad">${hard.map(x=>`<li><span class="tag n-h">${PK[x.a].th}ของคุณ ${x.asp.n} ${PK[x.b].th}ของ${esc(m.n)}</span> ${esc(x.txt)}</li>`).join('')}</ul>`;
      if (m.o.notime) body += `<p class="sub">ไม่ทราบเวลาเกิดของ${esc(m.n)} ตำแหน่งดวงจันทร์อาจคลาดได้ถึงราว 7°</p>`;
      body += `<button class="more" type="button" data-remove="${i}">ลบ${esc(m.n)}ออกจากรายการ</button>`;
      html += item('mb-'+i, sum, body);
    });
    html += `</div>`;
    // ภาพรวมทีม
    const tot = {fire:0,earth:0,air:0,water:0}; rows.forEach(r=>Object.keys(tot).forEach(k=>tot[k]+=r.P.e[k]));
    const strongBy = el => rows.filter(r=>r.P.e[el]>=3).map(r=>esc(r.n));
    html += `<h3 style="margin-top:26px">ภาพรวมทีม (${rows.length} คน)</h3><div class="scroll"><table class="tt"><thead><tr><th>ชื่อ</th><th>บทบาท</th><th>สไตล์</th><th>ไฟ</th><th>ดิน</th><th>ลม</th><th>น้ำ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${ROLE_EL[r.P.el].n}</td><td>${soloLabel(r.P.pct)}</td>${['fire','earth','air','water'].map(k=>`<td class="num${r.P.e[k]>=3?' hi':''}">${r.P.e[k]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    html += `<ul class="hl">${Object.keys(TASKS).map(el=>{ const s = strongBy(el); return `<li><b>${TASKS[el].t}</b> ${s.length ? `คนที่ถนัด: ${s.join(' ')} ควรรับผิดชอบงานด้านนี้เป็นหลัก` : 'ยังไม่มีใครในทีมถนัดด้านนี้ ควรหาคนเพิ่มหรือแบ่งเวลาให้งานด้านนี้มากขึ้น'}</li>`; }).join('')}</ul>`;
    const roles = {}; rows.forEach(r=>roles[r.P.el]=(roles[r.P.el]||0)+1);
    const many = Object.keys(roles).filter(k=>roles[k]>=Math.max(2, Math.ceil(rows.length*0.6)));
    if (many.length && rows.length>=3) html += `<p class="sub">ทีมนี้มี${ROLE_EL[many[0]].n}หลายคน ทำงานเข้ากันง่าย แต่อาจมีจุดบอดเดียวกัน ลองเติมคนที่มีธาตุอื่นเด่นเข้ามา</p>`;
  } else html += `<p class="empty">ยังไม่มีเพื่อนร่วมงานในรายการ</p>`;
  html += `<p class="sub" style="margin-top:14px">ใช้เพื่อทำความเข้าใจกันและแบ่งบทบาทเท่านั้น ไม่ควรใช้ตัดสินการจ้างงานหรือประเมินผลงานของใคร ข้อมูลเพื่อนร่วมงานเก็บไว้ในเบราว์เซอร์ของคุณเท่านั้น</p></section>`;
  $('p-work').innerHTML = html;
  $('m-notime').addEventListener('change', e=>{ $('m-hour').disabled = $('m-minute').disabled = e.target.checked; });
}
let CUR = null;
document.addEventListener('submit', e=>{
  if (e.target.id !== 'mf') return;
  e.preventDefault();
  const o = {name:$('m-name').value.trim().replace(/[<>&"]/g,''), day:$('m-day').value, month:$('m-month').value, year:$('m-year').value, hour:$('m-hour').value, minute:$('m-minute').value, notime:$('m-notime').checked, place:$('m-place').value};
  const err = memberError(o); if (err) { $('m-err').textContent = err; return; }
  TEAM.push(o); saveTeam(); renderWork(CUR.inp, CUR.ch); openItem('work', 'mb-'+(TEAM.length-1));
});
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-remove]'); if (!b) return;
  TEAM.splice(+b.dataset.remove, 1); saveTeam(); renderWork(CUR.inp, CUR.ch); openItem('work','team');
});

function render(inp, ch) {
  CUR = {inp, ch};
  const dtf = new Intl.DateTimeFormat('th-TH',{dateStyle:'long',...(inp.timeKnown?{timeStyle:'short'}:{}),timeZone:'UTC'});
  const localShown = dtf.format(new Date(inp.ms + inp.off*60000));
  $('cTitle').textContent = inp.title;
  $('cSub').textContent = inp.sub || `${localShown}${inp.timeKnown?' น.':' (ไม่ทราบเวลาเกิด คำนวณที่เที่ยงวัน)'} ที่${inp.placeName} (${fmtOff(inp.off)})`;
  drawWheel(ch);
  renderOverview(inp, ch); renderPlanets(inp, ch); renderHouses(inp, ch); renderAspects(inp, ch); renderWork(inp, ch); renderSummary(inp, ch);
  const notes = [];
  if (ch.houseNote) notes.push(ch.houseNote);
  notes.push('ใช้ระบบราศีแบบตะวันตก (Tropical) ตำแหน่งดาวคำนวณในเบราว์เซอร์ของคุณ ไม่มีการส่งข้อมูลออกไป ความคลาดเคลื่อนราว 1 ถึง 2 ลิปดา ใช้ได้กับปีเกิด ค.ศ. 1800 ถึง 2100 คำอธิบายเป็นความหมายทั่วไปเพื่อการเรียนรู้และความบันเทิง');
  $('note').textContent = notes.join(' ');
}

/* ---------- input handling ---------- */
function readForm() {
  const d = +$('day').value, mo = +$('month').value; let y = +$('year').value;
  const timeKnown = !$('notime').checked;
  const h = timeKnown ? +$('hour').value : 12, mi = timeKnown ? +($('minute').value||0) : 0;
  if (!d || !mo || !y) return {error:'กรอกวัน เดือน และปีเกิดให้ครบ'};
  if (y > 2300) y -= 543;
  if (y < 1800 || y > 2100) return {error:'ปีเกิดต้องอยู่ระหว่าง ค.ศ. 1800 ถึง 2100 (พ.ศ. 2343 ถึง 2643)'};
  const leap = y%4===0 && (y%100!==0 || y%400===0);
  const dim = [31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];
  if (d<1 || d>dim) return {error:`เดือน${MONTHS[mo-1]}ปีนั้นมี ${dim} วัน ตรวจวันเกิดอีกครั้ง`};
  if (timeKnown && ($('hour').value==='' || h<0 || h>23 || mi<0 || mi>59)) return {error:'กรอกเวลาเกิด (ชั่วโมง 0 ถึง 23) หรือเลือก ไม่ทราบเวลาเกิด'};
  let loc;
  if ($('place').value === 'custom') {
    const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
    if (isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return {error:'กรอกละติจูด (−90 ถึง 90) และลองจิจูด (−180 ถึง 180)'};
    loc = {n:`พิกัด ${lat.toFixed(3)}, ${lon.toFixed(3)}`, lat, lon, tz:null, off:+$('utcoff').value*60};
  } else loc = PLACES[+$('place').value];
  const {ms, off} = localToUTC(y,mo,d,h,mi,loc);
  const name = $('name').value.trim();
  return { ms, off, lat:loc.lat, lon:loc.lon, timeKnown, placeName:loc.n, houses:$('houses').value,
    title: name ? `ดวงกำเนิดของ${name}` : 'ดวงกำเนิดของคุณ' };
}
const FIELDS = ['name','day','month','year','hour','minute','place','lat','lon','utcoff','houses'];
function save() { try { const o={}; FIELDS.forEach(f=>o[f]=$(f).value); o.notime=$('notime').checked; localStorage.setItem('birthchart:last', JSON.stringify(o)); } catch(e) {} }
function restore() {
  try {
    const o = JSON.parse(localStorage.getItem('birthchart:last')||'null'); if (!o) return false;
    FIELDS.forEach(f=>{ if (o[f]!=null && o[f]!=='') $(f).value=o[f]; });
    $('notime').checked = !!o.notime; $('notime').dispatchEvent(new Event('change')); $('place').dispatchEvent(new Event('change'));
    return true;
  } catch(e) { return false; }
}
function showNow() {
  const now = Date.now(), loc = TH[0];
  const inp = { ms:now, off:tzOffsetMin(loc.tz, now), lat:loc.lat, lon:loc.lon, timeKnown:true, placeName:loc.n, houses:$('houses').value,
    title:'ท้องฟ้าขณะนี้เหนือกรุงเทพฯ', sub:'ตัวอย่างดวง ณ เวลาปัจจุบัน กรอกข้อมูลเกิดเพื่อดูดวงของคุณเอง' };
  render(inp, compute(inp));
}
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const inp = readForm();
  if (inp.error) { $('err').textContent = inp.error; return; }
  $('err').textContent = '';
  render(inp, compute(inp)); save(); selectTab('overview');
  if (window.matchMedia('(max-width:860px)').matches) $('out').scrollIntoView({behavior: reduceMotion?'auto':'smooth'});
});
$('houses').addEventListener('change', ()=>{ const inp=readForm(); if (!inp.error) { render(inp,compute(inp)); save(); } else showNow(); });

$('place').value = '0';
if (restore()) { const inp = readForm(); inp.error ? showNow() : render(inp, compute(inp)); } else showNow();
</script>
</body>
</html>
