<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ดวงกำเนิด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;700&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EDF2; --surface:#F5F7FA; --ink:#1B3A6B; --ink-soft:#5B7396; --line:#B7C5D7; --line-soft:#D3DCE7;
  --band:#DCE4EE; --accent:#B97A10; --tense:#B0402C; --harmony:#2C6AA3; --field:#FFFFFF; --error:#A33A28; --flash:#F6E7C8;
  --sym:"Noto Sans Symbols","Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --display:"Noto Serif Thai","Noto Serif","Georgia",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1B31; --surface:#132645; --ink:#D6E2F3; --ink-soft:#8EA5C5; --line:#2D4670; --line-soft:#1F365A;
    --band:#172C4F; --accent:#E6AE48; --tense:#E57B63; --harmony:#7DB1E3; --field:#0F2140; --error:#F08A72; --flash:#3A3420;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1B31; --surface:#132645; --ink:#D6E2F3; --ink-soft:#8EA5C5; --line:#2D4670; --line-soft:#1F365A;
  --band:#172C4F; --accent:#E6AE48; --tense:#E57B63; --harmony:#7DB1E3; --field:#0F2140; --error:#F08A72; --flash:#3A3420;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.2;margin:0;letter-spacing:.01em}
header p{margin:0;color:var(--ink-soft);max-width:52ch}
.layout{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:860px){form{position:static}}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:600;font-size:15px;padding:0;margin-bottom:6px}
.row{display:grid;gap:8px}
.r3{grid-template-columns:64px 1fr 92px}
.r2{grid-template-columns:1fr 1fr}
label.mini{display:grid;gap:3px;font-size:13px;color:var(--ink-soft)}
label.top{font-size:15px;color:var(--ink);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:disabled{opacity:.45}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.hint{font-size:13px;color:var(--ink-soft);margin:0}
.btn{font:inherit;font-weight:600;font-size:16px;background:var(--ink);color:var(--surface);border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.err{color:var(--error);font-size:14px;margin:0}
.err:empty{display:none}
#customLoc[hidden]{display:none}

.chart-head h2{font-family:var(--display);font-weight:500;font-size:clamp(22px,3vw,28px);margin:0;line-height:1.3}
.chart-head p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.wheel{width:100%;max-width:640px;display:block;margin:6px auto 0}
.wheel-hint{text-align:center;font-size:13px;color:var(--ink-soft);margin:2px 0 18px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:16px;font-weight:500;color:var(--ink-soft);background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 14px 9px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panel{padding:20px 0 0}
.panel[hidden]{display:none}
.intro{color:var(--ink-soft);max-width:66ch;margin:0 0 18px;font-size:15px}
h3{font-family:var(--display);font-weight:500;font-size:19px;margin:26px 0 8px}
.panel > h3:first-child{margin-top:0}

.big3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.big3 > div{padding:16px 16px 16px 0;display:flex;flex-direction:column}
.big3 > div + div{border-left:1px solid var(--line-soft);padding-left:16px}
.big3 .k{font-size:13px;color:var(--ink-soft)}
.big3 .v{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.35;margin:2px 0 6px}
.big3 .v .g{font-family:var(--sym);margin-right:4px}
.big3 .d{font-size:14px;line-height:1.6;flex:1}
.more{font:inherit;font-size:13.5px;color:var(--harmony);background:none;border:0;padding:8px 0 0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.big3{grid-template-columns:1fr}.big3 > div + div{border-left:0;border-top:1px solid var(--line-soft);padding-left:0}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.bars{display:grid;gap:8px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:78px 1fr 22px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink-soft);border-radius:4px}
.bar.top .t i{background:var(--ink)}
.explain{font-size:14.5px;margin:6px 0 0;max-width:60ch}

/* accordion items */
.list{border-top:1px solid var(--line)}
details.item{border-bottom:1px solid var(--line-soft);transition:background-color .6s}
details.item.flash{background:var(--flash)}
details.item > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto 18px;gap:10px;align-items:center;padding:11px 4px}
details.item > summary::-webkit-details-marker{display:none}
details.item > summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--ink-soft);border-bottom:1.5px solid var(--ink-soft);transform:rotate(45deg);justify-self:center;margin-top:-4px;transition:transform .2s}
details.item[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
details.item > summary:hover{background:color-mix(in srgb, var(--band) 60%, transparent)}
.gl{font-family:var(--sym);font-size:20px;text-align:center;line-height:1}
.gl.txt{font-family:var(--body);font-size:12px;font-weight:600;color:var(--accent)}
.sm-name{font-weight:500}
.sm-sub{color:var(--ink-soft);font-size:13.5px}
.sm-right{font-size:14px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.sg{font-family:var(--sym)}
.num{font-variant-numeric:tabular-nums}
.rx{display:inline-block;color:var(--tense);font-size:11.5px;font-weight:600;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;line-height:1.4;vertical-align:1px}
.body{padding:2px 4px 16px 44px;max-width:72ch}
.body p{margin:0 0 8px;font-size:15px}
.body p:last-child{margin-bottom:0}
.body b{font-weight:600}
@media (max-width:520px){.body{padding-left:4px}}
.cnt{display:inline-block;min-width:20px;text-align:center;font-size:12px;border-radius:10px;background:var(--band);padding:0 6px;margin-left:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 22px;margin:0 0 22px}
.legend div{font-size:14px;line-height:1.5;padding-left:14px;border-left:3px solid var(--c)}
.legend b{font-weight:600}
.c-tense{--c:var(--tense)} .c-harm{--c:var(--harmony)} .c-conj{--c:var(--accent)}
.asp-name{font-weight:600;color:var(--c)}
.empty{color:var(--ink-soft);font-size:15px;padding:12px 0}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:0 6px;margin-left:6px;color:var(--c);border:1px solid currentColor;line-height:1.5;vertical-align:1px}
.n-e{--c:var(--harmony)} .n-h{--c:var(--tense)} .n-m{--c:var(--accent)}
.tag.n-k{color:var(--surface);background:var(--accent);border-color:var(--accent)}
.more.inl{padding:0;font-size:inherit}
.body p.lead{font-size:15.5px}
p.sub,.body p.sub{color:var(--ink-soft);font-size:14px}
.rbox{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin-top:10px;font-size:15px;line-height:1.65}
ul.pl{margin:0 0 8px;padding-left:18px} ul.pl li{font-size:15px;margin-bottom:4px}
.sec{margin-bottom:10px}
ul.hl{list-style:none;padding:0;margin:0}
ul.hl li{padding:8px 0 8px 14px;border-left:3px solid var(--line);margin-bottom:8px;font-size:15px;max-width:74ch;line-height:1.65}
ul.hl.good li{border-left-color:var(--harmony)} ul.hl.bad li{border-left-color:var(--tense)}
ul.hl .tag{margin:0 4px 0 0}
.cta{display:inline-block;font:inherit;font-weight:600;font-size:15px;color:var(--surface);background:var(--ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin:0 0 18px}
.w-st{fill:var(--accent)} .w-sth{fill:var(--accent);opacity:.2}
.w-kum .w-pl{fill:var(--accent)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line-soft);margin:14px 9px 4px}
.meter i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);transform:translate(-50%,-50%)}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:10px}
p.lead-l{font-size:16.5px;margin:6px 0}
p.k2{font-weight:600;font-size:14px;margin:10px 0 4px}
dl.dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:12px 0 0;font-size:15px}
dl.dl dt{color:var(--ink-soft);font-size:14px} dl.dl dd{margin:0;max-width:64ch}
@media (max-width:560px){dl.dl{grid-template-columns:1fr;gap:2px} dl.dl dd{margin-bottom:10px}}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.task{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.task-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.task p{margin:6px 0 0;font-size:14.5px}
.mform{position:static;display:grid;gap:12px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
table.tt td.hi{font-weight:700;color:var(--ink)}
table.tt{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:12px} table.tt th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)} table.tt td{padding:7px 8px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);white-space:nowrap}
.gen{font-size:14px !important;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:10px}
.note{font-size:13px;color:var(--ink-soft);margin-top:32px;border-top:1px solid var(--line-soft);padding-top:14px;max-width:72ch}

/* wheel */
.w-band{fill:var(--band)} .w-band2{fill:var(--surface)}
.w-line{stroke:var(--line);fill:none;stroke-width:1}
.w-ink{stroke:var(--ink);fill:none;stroke-width:1.2}
.w-tick{stroke:var(--ink-soft);stroke-width:.7}
.w-sign{font-family:var(--sym);font-size:21px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.w-house{font-family:var(--body);font-size:11px;fill:var(--ink-soft);text-anchor:middle;dominant-baseline:central}
.w-cusp{stroke:var(--line);stroke-width:1}
.w-axis{stroke:var(--accent);stroke-width:2}
.w-axlbl{font-family:var(--body);font-size:12px;font-weight:600;fill:var(--accent);text-anchor:middle;dominant-baseline:central}
.w-pl{font-family:var(--sym);font-size:20px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.w-deg{font-family:var(--body);font-size:10px;fill:var(--ink-soft);text-anchor:middle;dominant-baseline:central}
.w-ptick{stroke:var(--ink);stroke-width:1.4}
.w-conn{stroke:var(--line);stroke-width:.8}
.w-a-t{stroke:var(--tense)} .w-a-h{stroke:var(--harmony)}
.w-hit{stroke:transparent;stroke-width:12;cursor:pointer}
.w-click{cursor:pointer}
.w-click circle{fill:transparent}
.w-click:hover .w-pl,.w-click:focus-visible .w-pl{fill:var(--accent)}
.w-click:hover circle,.w-click:focus-visible circle{fill:var(--band)}
.w-hclick{cursor:pointer}
.w-hclick:hover .w-house{fill:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .wheel .w-planets,.wheel .w-aspects{animation:fade .6s ease-out both}
  .wheel .w-aspects{animation-delay:.15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ดวงกำเนิด</h1>
    <p>กรอกวัน เวลา และสถานที่เกิด แล้วอ่านความหมายของดวงคุณตามโหราศาสตร์ตะวันตก ทีละเรื่องอย่างเข้าใจง่าย</p>
  </header>

  <div class="layout">
    <form id="f" novalidate>
      <label class="mini top">ชื่อ (ไม่บังคับ)
        <input id="name" type="text" autocomplete="off" placeholder="เช่น น้ำฝน">
      </label>
      <fieldset>
        <legend>วันเกิด</legend>
        <div class="row r3">
          <label class="mini">วัน<input id="day" type="number" inputmode="numeric" min="1" max="31" placeholder="15"></label>
          <label class="mini">เดือน<select id="month"></select></label>
          <label class="mini">ปี<input id="year" type="number" inputmode="numeric" placeholder="2535"></label>
        </div>
        <p class="hint">ใส่ปีเป็น พ.ศ. หรือ ค.ศ. ก็ได้</p>
      </fieldset>
      <fieldset>
        <legend>เวลาเกิด</legend>
        <div class="row r2">
          <label class="mini">ชั่วโมง<input id="hour" type="number" inputmode="numeric" min="0" max="23" placeholder="08"></label>
          <label class="mini">นาที<input id="minute" type="number" inputmode="numeric" min="0" max="59" placeholder="30"></label>
        </div>
        <label class="check"><input id="notime" type="checkbox"> ไม่ทราบเวลาเกิด</label>
      </fieldset>
      <fieldset>
        <legend>สถานที่เกิด</legend>
        <select id="place" aria-label="สถานที่เกิด"></select>
        <div id="customLoc" class="row" hidden>
          <div class="row r2">
            <label class="mini">ละติจูด (เหนือ +)<input id="lat" type="number" step="0.0001" placeholder="13.7563"></label>
            <label class="mini">ลองจิจูด (ตะวันออก +)<input id="lon" type="number" step="0.0001" placeholder="100.5018"></label>
          </div>
          <label class="mini">เขตเวลา<select id="utcoff"></select></label>
          <p class="hint">หาพิกัดได้จาก Google Maps โดยกดค้างที่ตำแหน่งนั้น</p>
        </div>
      </fieldset>
      <label class="mini">ระบบเรือน
        <select id="houses">
          <option value="placidus">Placidus (นิยมที่สุด)</option>
          <option value="whole">Whole Sign (เรือนละหนึ่งราศี)</option>
          <option value="equal">Equal (เรือนละ 30° เท่ากัน)</option>
        </select>
      </label>
      <p class="err" id="err" role="alert" aria-live="polite"></p>
      <button class="btn" type="submit">ดูดวงกำเนิด</button>
    </form>

    <main id="out">
      <div class="chart-head"><h2 id="cTitle"></h2><p id="cSub"></p></div>
      <svg id="wheel" class="wheel" viewBox="0 0 640 640" role="img" aria-labelledby="cTitle"></svg>
      <p class="wheel-hint">กดที่สัญลักษณ์ดาว เลขเรือน หรือเส้นมุมบนวงดวงเพื่ออ่านคำอธิบาย</p>

      <div class="tabs" role="tablist" aria-label="หมวดคำอธิบาย">
        <button class="tab" role="tab" id="t-overview" aria-controls="p-overview" aria-selected="true">ภาพรวม</button>
        <button class="tab" role="tab" id="t-planets" aria-controls="p-planets" aria-selected="false" tabindex="-1">ดวงดาว</button>
        <button class="tab" role="tab" id="t-houses" aria-controls="p-houses" aria-selected="false" tabindex="-1">เรือน</button>
        <button class="tab" role="tab" id="t-aspects" aria-controls="p-aspects" aria-selected="false" tabindex="-1">มุม</button>
        <button class="tab" role="tab" id="t-work" aria-controls="p-work" aria-selected="false" tabindex="-1">การทำงาน</button>
        <button class="tab" role="tab" id="t-summary" aria-controls="p-summary" aria-selected="false" tabindex="-1">สรุปไฮไลต์</button>
      </div>
      <section class="panel" role="tabpanel" id="p-overview" aria-labelledby="t-overview"></section>
      <section class="panel" role="tabpanel" id="p-planets" aria-labelledby="t-planets" hidden></section>
      <section class="panel" role="tabpanel" id="p-houses" aria-labelledby="t-houses" hidden></section>
      <section class="panel" role="tabpanel" id="p-aspects" aria-labelledby="t-aspects" hidden></section>
      <section class="panel" role="tabpanel" id="p-work" aria-labelledby="t-work" hidden></section>
      <section class="panel" role="tabpanel" id="p-summary" aria-labelledby="t-summary" hidden></section>
      <p class="note" id="note"></p>
    </main>
  </div>
</div>

<script>
// Planetary positions after Paul Schlyter's method (ecliptic & equinox of date = tropical zodiac)
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const norm = a => ((a % 360) + 360) % 360;
const sind = x => Math.sin(x * D2R), cosd = x => Math.cos(x * D2R);
const atan2d = (y, x) => Math.atan2(y, x) * R2D;

function kepler(M, e) {
  let E = M + R2D * e * sind(M) * (1 + e * cosd(M));
  for (let k = 0; k < 30; k++) {
    const dE = (E - R2D * e * sind(E) - M) / (1 - e * cosd(E));
    E -= dE;
    if (Math.abs(dE) < 1e-8) break;
  }
  return E;
}

function orbit(el) {
  const M = norm(el.M);
  const E = kepler(M, el.e);
  const xv = el.a * (cosd(E) - el.e);
  const yv = el.a * Math.sqrt(1 - el.e * el.e) * sind(E);
  const v = atan2d(yv, xv), r = Math.hypot(xv, yv);
  const vw = v + el.w;
  const x = r * (cosd(el.N) * cosd(vw) - sind(el.N) * sind(vw) * cosd(el.i));
  const y = r * (sind(el.N) * cosd(vw) + cosd(el.N) * sind(vw) * cosd(el.i));
  const z = r * sind(vw) * sind(el.i);
  return { x, y, z, r, v, M };
}

function elements(d) {
  return {

// Ecliptic longitudes (degrees, tropical) for a Julian Day (UT)
function longitudes(jd) {
  const d = jd - 2451543.5;
  const el = elements(d);
  const s = orbit(el.sun);
  const sunLon = norm(s.v + el.sun.w);
  const xs = s.r * cosd(sunLon), ys = s.r * sind(sunLon);
  const out = { sun: sunLon };

  // Moon
  const m = orbit(el.moon);
  let mlon = atan2d(m.y, m.x);
  const Ms = norm(el.sun.M), Mm = norm(el.moon.M);
  const Ls = Ms + el.sun.w, Lm = Mm + el.moon.w + el.moon.N;
  const D = Lm - Ls, F = Lm - el.moon.N;
  mlon += -1.274 * sind(Mm - 2 * D) + 0.658 * sind(2 * D) - 0.186 * sind(Ms)
    - 0.059 * sind(2 * Mm - 2 * D) - 0.057 * sind(Mm - 2 * D + Ms) + 0.053 * sind(Mm + 2 * D)
    + 0.046 * sind(2 * D - Ms) + 0.041 * sind(Mm - Ms) - 0.035 * sind(D)
    - 0.031 * sind(Mm + Ms) - 0.015 * sind(2 * F - 2 * D) + 0.011 * sind(Mm - 4 * D);
  out.moon = norm(mlon);

  const Mj = norm(el.jupiter.M), Msa = norm(el.saturn.M), Mu = norm(el.uranus.M);
  const pert = {
    jupiter: -0.332 * sind(2 * Mj - 5 * Msa - 67.6) - 0.056 * sind(2 * Mj - 2 * Msa + 21) + 0.042 * sind(3 * Mj - 5 * Msa + 21)
      - 0.036 * sind(Mj - 2 * Msa) + 0.022 * cosd(Mj - Msa) + 0.023 * sind(2 * Mj - 3 * Msa + 52) - 0.016 * sind(Mj - 5 * Msa - 69),
    saturn: 0.812 * sind(2 * Mj - 5 * Msa - 67.6) - 0.229 * cosd(2 * Mj - 4 * Msa - 2) + 0.119 * sind(Mj - 2 * Msa - 3)
      + 0.046 * sind(2 * Mj - 6 * Msa - 69) + 0.014 * sind(Mj - 3 * Msa + 32),
    uranus: 0.04 * sind(Msa - 2 * Mu + 6) + 0.035 * sind(Msa - 3 * Mu + 33) - 0.015 * sind(Mj - Mu + 20),
  };

  const geo = (xh, yh) => norm(atan2d(yh + ys, xh + xs));
  for (const p of ['mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune']) {
    const o = orbit(el[p]);
    let { x, y, z } = o;
    if (pert[p]) {
      const lon = atan2d(y, x) + pert[p];
      const lat = atan2d(z, Math.hypot(x, y));
      const r = Math.hypot(x, y, z);
      x = r * cosd(lat) * cosd(lon); y = r * cosd(lat) * sind(lon);
    }
    out[p] = geo(x, y);
  }

  // Pluto (heliocentric, J2000 → equinox of date)
  const S = 50.03 + 0.033459652 * d, P = 238.95 + 0.003968789 * d;
  const plon = 238.9508 + 0.00400703 * d - 19.799 * sind(P) + 19.848 * cosd(P) + 0.897 * sind(2 * P) - 4.956 * cosd(2 * P)
    + 0.61 * sind(3 * P) + 1.211 * cosd(3 * P) - 0.341 * sind(4 * P) - 0.19 * cosd(4 * P) + 0.128 * sind(5 * P) - 0.034 * cosd(5 * P)
    - 0.038 * sind(6 * P) + 0.031 * cosd(6 * P) + 0.02 * sind(S - P) - 0.01 * cosd(S - P);
  const plat = -3.9082 - 5.453 * sind(P) - 14.975 * cosd(P) + 3.527 * sind(2 * P) + 1.673 * cosd(2 * P) - 1.051 * sind(3 * P)
    + 0.328 * cosd(3 * P) + 0.179 * sind(4 * P) - 0.292 * cosd(4 * P) + 0.019 * sind(5 * P) + 0.1 * cosd(5 * P)
    - 0.031 * sind(6 * P) - 0.026 * cosd(6 * P) + 0.011 * cosd(S - P);
  const pr = 40.72 + 6.68 * sind(P) + 6.9 * cosd(P) - 1.18 * sind(2 * P) - 0.03 * cosd(2 * P) + 0.15 * sind(3 * P) - 0.14 * cosd(3 * P);
  out.pluto = geo(pr * cosd(plat) * cosd(plon), pr * cosd(plat) * sind(plon));

  out.node = norm(el.moon.N); // mean north node (ราหู)
  return out;
}

function obliquity(jd) { return 23.4393 - 3.563e-7 * (jd - 2451543.5); }

function lstDeg(jd, lonEast) {
  const T = (jd - 2451545) / 36525;
  const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545) + 0.000387933 * T * T - T * T * T / 38710000;
  return norm(gmst + lonEast);
}

function angles(jd, lat, lon) {
  const eps = obliquity(jd), ramc = lstDeg(jd, lon);
  const mc = norm(atan2d(sind(ramc), cosd(ramc) * cosd(eps)));
  const asc = norm(atan2d(cosd(ramc), -(sind(ramc) * cosd(eps) + Math.tan(lat * D2R) * sind(eps))));
  return { asc, mc, ramc, eps };
}

function eclFromRA(ra, eps) { return norm(atan2d(sind(ra), cosd(ra) * cosd(eps))); }

function placidus(ramc, eps, lat) {
  if (Math.abs(lat) >= 66) return null;
  const tphi = Math.tan(lat * D2R);
  const cusp = (above, f) => {
    let ra = above ? ramc + f * 90 : ramc + 180 - f * 90, lam = 0;
    for (let k = 0; k < 50; k++) {
      lam = eclFromRA(ra, eps);
      const dec = Math.asin(sind(eps) * sind(lam)) * R2D;
      const x = tphi * Math.tan(dec * D2R);
      if (Math.abs(x) > 1) return NaN;
      const ad = Math.asin(x) * R2D;
      const next = above ? ramc + f * (90 + ad) : ramc + 180 - f * (90 - ad);
      if (Math.abs(next - ra) < 1e-7) { ra = next; break; }
      ra = next;
    }
    return eclFromRA(ra, eps);
  };
  const c11 = cusp(true, 1 / 3), c12 = cusp(true, 2 / 3), c2 = cusp(false, 2 / 3), c3 = cusp(false, 1 / 3);
  if ([c11, c12, c2, c3].some(Number.isNaN)) return null;
  return { c11, c12, c2, c3 };
}

 'moon-saturn':['h','อารมณ์กับความรับผิดชอบ','มีวุฒิภาวะทางอารมณ์ ใจเย็น รับมือเรื่องยากได้มั่นคง และเป็นที่พึ่งของคนอื่น','อาจเคยรู้สึกขาดความอบอุ่นหรือต้องเก็บความรู้สึกตั้งแต่เด็ก จึงแสดงอารมณ์ยาก กลัวการพึ่งพาคนอื่น และเครียดหรือเศร้าแบบเงียบ ๆ การอนุญาตให้ตัวเองรู้สึกและขอความช่วยเหลือคือบทเรียนสำคัญ','เก็บอารมณ์เก่ง ดูเข้มแข็งและเป็นผู้ใหญ่ แต่ข้างในอาจรู้สึกเหงาหรือกังวล และไม่ค่อยให้ตัวเองได้พักหรือได้รับการดูแล ยิ่งโตยิ่งมั่นคงทางใจ'],
 'moon-uranus':['m','อารมณ์กับความเป็นอิสระ','เปิดรับสิ่งใหม่ อารมณ์ไม่ยึดติด เป็นเพื่อนที่เข้าใจความแตกต่าง','อารมณ์เปลี่ยนเร็ว อยากใกล้ชิดแต่ก็อยากมีพื้นที่ส่วนตัว ความสัมพันธ์จึงอาจขึ้นลง','ต้องการอิสระทางใจมาก อารมณ์คาดเดายาก ไม่ชอบถูกผูกมัด แต่เป็นคนเปิดกว้างและไม่ตัดสินใคร'],
 'moon-neptune':['m','อารมณ์กับจินตนาการ','อ่อนโยน เห็นอกเห็นใจ มีสัญชาตญาณดี และมีหัวศิลปะ','ซึมซับอารมณ์คนอื่นง่ายจนเหนื่อย แยกความรู้สึกตัวเองกับคนอื่นไม่ออก หรือหนีปัญหาด้วยการเพ้อฝัน ควรตั้งขอบเขตให้ชัด','อ่อนไหวมาก สัมผัสความรู้สึกคนอื่นได้ลึก จินตนาการสูง แต่ต้องระวังการแบกอารมณ์คนอื่นไว้มากเกินไป'],
 'moon-pluto':['h','อารมณ์กับการเปลี่ยนแปลงลึก ๆ','อารมณ์ลึกซึ้ง เข้าใจจิตใจคนได้ดี และมีพลังใจในการเปลี่ยนแปลงตัวเอง','อารมณ์เข้มข้น อาจหึงหวง กลัวการสูญเสีย หรือเก็บความรู้สึกจนระเบิด ความสัมพันธ์มักลึกและเปลี่ยนชีวิต','อารมณ์ลึกและเข้มข้น รักใครก็รักจริง แต่ยึดติดและกลัวถูกทิ้ง บทเรียนคือการปล่อยวาง'],
 'moon-asc':['e','อารมณ์กับภาพลักษณ์','แสดงความรู้สึกออกมาอย่างเป็นธรรมชาติ คนรอบตัวรู้สึกอบอุ่นเมื่ออยู่ใกล้','สิ่งที่รู้สึกกับสิ่งที่แสดงออกไม่ตรงกัน คนจึงอาจอ่านอารมณ์คุณผิด','อารมณ์แสดงออกทางสีหน้าชัด อ่อนไหวต่อสภาพแวดล้อม และดูเป็นคนอบอุ่นเข้าถึงง่าย'],
 'moon-mc':['e','อารมณ์กับอาชีพ','ทำงานด้วยหัวใจ เหมาะกับงานที่ดูแลหรือเข้าใจผู้คน','อาจรู้สึกว่างานกับชีวิตครอบครัวแย่งเวลากัน ต้องหาสมดุล','อาชีพผูกกับความรู้สึก อยากทำงานที่ใจรัก และมักเป็นที่รู้จักในเรื่องการดูแลคนอื่น'],
 'mercury-venus':['e','ความคิดกับความรัก','พูดจาน่าฟัง มีศิลปะในการสื่อสาร เหมาะกับงานเขียน ออกแบบ หรือการเจรจา','อาจพูดเอาใจจนไม่จริงใจ หรือตัดสินใจด้วยความชอบมากกว่าเหตุผล','พูดจาไพเราะ มีรสนิยม สื่อสารอย่างนุ่มนวล ชอบภาษา ศิลปะ และการพูดคุยที่ราบรื่น'],
 'mercury-mars':['m','ความคิดกับแรงขับ','คิดเร็ว ตัดสินใจเด็ดขาด พูดตรงและโน้มน้าวเก่ง','พูดแรงหรือชอบเถียง อาจด่วนสรุป หรือใช้คำพูดทำร้ายคนอื่นโดยไม่ตั้งใจ','คิดเร็ว พูดตรง ชอบโต้แย้ง ความคิดคมแต่บางครั้งคำพูดก็คมเกินไป'],
 'mercury-jupiter':['e','ความคิดกับโอกาส','มองภาพกว้าง ชอบเรียนรู้ อธิบายเก่ง เหมาะกับการสอนหรือเผยแพร่ความรู้','มองภาพใหญ่จนพลาดรายละเอียด พูดเกินจริง หรือรับปากเกินกว่าที่ทำได้','ความคิดกว้างไกล รักการเรียนรู้ พูดเก่ง มีอารมณ์ขัน แต่อาจพูดมากหรือมองข้ามรายละเอียด'],
 'mercury-saturn':['m','ความคิดกับวินัย','คิดเป็นระบบ รอบคอบ จดจ่อได้นาน เหมาะกับงานที่ต้องการความแม่นยำ','กังวลหรือคิดลบเกินไป สงสัยในความสามารถของตัวเอง หรือรู้สึกว่าพูดแล้วไม่มีใครฟัง แต่เมื่อฝึกฝน ความคิดของคุณจะลึกและน่าเชื่อถือมาก','คิดจริงจัง ลึก และรอบคอบ พูดน้อยแต่มีน้ำหนัก อาจเรียนรู้ช้าในตอนแรกแต่เข้าใจได้ลึก ระวังการคิดลบ'],
 'mercury-uranus':['m','ความคิดกับความเป็นอิสระ','ไอเดียแปลกใหม่ หัวไว เข้าใจเทคโนโลยีและเรื่องอนาคตได้เร็ว','ความคิดกระโดด ใจร้อนกับคนที่คิดช้ากว่า หรือดื้อในความเห็นของตัวเอง','หัวไว คิดแหวกแนว มีไอเดียแบบปิ๊งแวบ แต่คิดเร็วจนคนอื่นตามไม่ทัน'],
 'mercury-neptune':['m','ความคิดกับจินตนาการ','จินตนาการดี เขียนหรือเล่าเรื่องเก่ง เข้าใจสิ่งที่ไม่ได้พูดออกมา','ความคิดสับสน ขี้ลืม หรือเข้าใจผิดง่าย ควรจดบันทึกและตรวจสอบข้อมูลให้ดี','คิดเป็นภาพ มีจินตนาการและสัญชาตญาณสูง เหมาะกับงานสร้างสรรค์ แต่อาจไม่ชัดเจนในเรื่องรายละเอียด'],
 'mercury-pluto':['m','ความคิดกับพลังการเปลี่ยนแปลง','คิดลึก วิเคราะห์เก่ง ชอบค้นหาความจริง เหมาะกับงานวิจัยหรือสืบสวน','คิดหมกมุ่น ระแวง หรือใช้คำพูดเพื่อควบคุม อาจโต้เถียงแบบต้องเอาชนะ','ความคิดเฉียบคมและลึก มองทะลุคำพูดคน พูดมีพลังโน้มน้าว แต่ระวังการคิดวนหรือหมกมุ่น'],
 'mercury-asc':['e','ความคิดกับภาพลักษณ์','สื่อสารเก่ง ดูเป็นคนฉลาดและคุยง่าย','คำพูดอาจทำให้คนอื่นเข้าใจคุณผิด ต้องเลือกคำให้ดี','ดูเป็นคนช่างพูด ช่างสังเกต หัวไว และมักเป็นที่รู้จักจากความคิดหรือคำพูด'],
 'mercury-mc':['e','ความคิดกับอาชีพ','อาชีพที่ใช้การสื่อสาร การเขียน หรือการคิดวิเคราะห์จะเหมาะกับคุณ','อาจลังเลเรื่องเส้นทางอาชีพหรือเปลี่ยนงานบ่อย','อาชีพเด่นด้านการสื่อสาร ความคิด การเขียน หรือการค้าขาย'],
 'venus-mars':['m','ความรักกับแรงขับ','มีเสน่ห์ดึงดูด รู้จักเข้าหาคนที่ชอบ ความรักมีทั้งความหวานและความตื่นเต้น','ความรักร้อนแรงแต่ขัดแย้งง่าย สิ่งที่อยากได้กับสิ่งที่ทำให้มีความสุขอาจไม่ตรงกัน','มีเสน่ห์แรง รักแบบเต็มที่ มีพลังสร้างสรรค์สูง แต่ความรักอาจร้อนแรงและเอาแต่ใจ'],
 'venus-jupiter':['e','ความรักกับโอกาส','ใจดี มีเสน่ห์ เป็นที่รัก และมักโชคดีเรื่องความสัมพันธ์และการเงิน','ตามใจตัวเองเกินไป ใช้จ่ายฟุ่มเฟือย หรือคาดหวังในความรักสูงเกินจริง','มีเสน่ห์ ใจกว้าง เป็นที่รักของคนรอบตัว และมักมีโชคเรื่องเงิน แต่ระวังความฟุ่มเฟือย'],
 'venus-saturn':['h','ความรักกับความรับผิดชอบ','รักอย่างมั่นคงและจริงจัง ซื่อสัตย์ ความสัมพันธ์ยิ่งนานยิ่งดี และจัดการเงินเก่ง','อาจรู้สึกไม่เป็นที่รักหรือกลัวถูกปฏิเสธ จึงระวังตัวในความรัก ความรักอาจมาช้าหรือมีอุปสรรค แต่เมื่อเจอคนที่ใช่ ความสัมพันธ์จะมั่นคงมาก','จริงจังกับความรัก รักช้าแต่รักนาน อาจเขินอายหรือไม่มั่นใจในเสน่ห์ของตัวเอง ความรักมักดีขึ้นตามวัย และมักชอบคนที่เป็นผู้ใหญ่'],
 'venus-uranus':['m','ความรักกับความเป็นอิสระ','ชอบความรักที่ให้อิสระ มีรสนิยมแปลกใหม่ และดึงดูดคนที่ไม่ธรรมดา','ความรักมาเร็วไปเร็ว อยากได้ทั้งความใกล้ชิดและอิสระ อาจเบื่อง่ายหรือดึงดูดความสัมพันธ์ที่ไม่มั่นคง','รักอิสระในความรัก ชอบความแปลกใหม่และตื่นเต้น ความสัมพันธ์ต้องมีพื้นที่ส่วนตัว'],
 'venus-neptune':['m','ความรักกับจินตนาการ','โรแมนติก อ่อนโยน มีหัวศิลปะ ดนตรี หรือการออกแบบ','มองคนรักในอุดมคติจนผิดหวัง หรือเสียสละในความรักมากเกินไป ควรมองความจริงให้ชัด','โรแมนติกมาก มีหัวศิลปะสูง รักแบบเสียสละ แต่อาจมองคนรักสวยงามเกินความจริง'],
 'venus-pluto':['h','ความรักกับพลังการเปลี่ยนแปลง','รักลึกซึ้งและจริงใจ ความสัมพันธ์ทำให้คุณเติบโต และมีเสน่ห์ลึกลับ','ความรักเข้มข้นจนหึงหวง ยึดติด หรือมีเรื่องอำนาจในความสัมพันธ์ ความรักมักเปลี่ยนชีวิตคุณ','มีเสน่ห์ลึกลับ รักแบบทุ่มสุดตัวและเข้มข้น แต่ต้องระวังความหึงหวงและการยึดติด'],
 'venus-asc':['e','ความรักกับภาพลักษณ์','มีเสน่ห์ เข้ากับคนง่าย ดูเป็นมิตร','อยากให้คนชอบมากจนเกรงใจเกินไป','มีเสน่ห์ ดูอ่อนโยน มีรสนิยม คนมักประทับใจตั้งแต่แรกเห็น'],
 'venus-mc':['e','ความรักกับอาชีพ','เหมาะกับงานด้านศิลปะ ความงาม หรือการประสานงาน และเป็นที่ชื่นชอบในที่ทำงาน','ความรักกับงานอาจแย่งความสำคัญกัน','อาชีพเด่นด้านศิลปะ ความงาม การออกแบบ หรือการเจรจา และมีภาพลักษณ์ที่น่าชื่นชม'],
 'mars-jupiter':['e','แรงขับกับโอกาส','กล้าลงมือ มีพลังและความกระตือรือร้น ทำเรื่องใหญ่ได้สำเร็จ','ทำเกินตัว รีบร้อน เสี่ยงเกินไป หรือรับงานมากจนหมดแรง','พลังเหลือล้น กล้าเสี่ยง ชอบความท้าทายใหญ่ ๆ แต่ระวังการทำเกินพอดี'],

}

function dignity(k, lon) {
  const d = DIGN[k]; if (!d) return null;
  const s = Math.floor(norm(lon)/30);
  for (const t of ['dom','ex','det','fall']) if (d[t].includes(s)) return t;
  return null;
}

const PH = {
  sun:['คุณเป็นคนเด่น มีตัวตนชัด และอยากเป็นผู้นำชีวิตตัวเอง คนมักจำคุณได้ตั้งแต่แรกพบ','ความภูมิใจในตัวเองผูกกับสิ่งที่หามาได้ด้วยตัวเอง คุณมั่นใจที่สุดเมื่อมีรายได้และทรัพย์สินที่สร้างเอง','คุณเปล่งประกายผ่านการพูด การเขียน และการเรียนรู้ ตัวตนของคุณสร้างขึ้นจากความคิดและการสื่อสาร','บ้านและครอบครัวคือศูนย์กลางชีวิต คุณเติบโตจากรากเหง้า และความสำเร็จสำคัญมักมาในช่วงหลังของชีวิต','คุณมีชีวิตชีวาเมื่อได้สร้างสรรค์ สนุก และแสดงออก มีความเป็นศิลปินและชอบอยู่บนเวที','คุณรู้สึกมีคุณค่าเมื่อได้ทำงานให้ดีและช่วยเหลือผู้อื่น กิจวัตรและสุขภาพมีผลต่อพลังของคุณมาก','คุณค้นพบตัวเองผ่านความสัมพันธ์ คู่ครองหรือหุ้นส่วนมีบทบาทสำคัญกับการเติบโตของคุณ','คุณสนใจเรื่องลึกลับและจิตใจคน ชีวิตมักผ่านการเปลี่ยนแปลงลึก ๆ ที่หล่อหลอมตัวตน','คุณเติบโตผ่านการเดินทาง การเรียนรู้ และการหาความหมายของชีวิต ชอบมองภาพกว้างและสอนผู้อื่น','คุณอยากประสบความสำเร็จและเป็นที่รู้จัก อาชีพคือเวทีหลักในการแสดงตัวตน','คุณเปล่งประกายในกลุ่มเพื่อนและสังคม มักเป็นศูนย์กลางของกลุ่มและมีความฝันเพื่อส่วนรวม','ตัวตนของคุณซ่อนอยู่ข้างใน ชอบทำงานเบื้องหลัง มีโลกภายในลึก และต้องการเวลาส่วนตัวเพื่อเติมพลัง'],
  moon:['อารมณ์ของคุณแสดงออกทางสีหน้าชัด อ่อนไหวต่อสภาพแวดล้อม คนรอบตัวสัมผัสความรู้สึกคุณได้ทันที','คุณรู้สึกปลอดภัยเมื่อมีเงินเก็บและสิ่งของที่คุ้นเคย รายได้อาจขึ้นลงตามอารมณ์หรือช่วงชีวิต','คุณต้องได้พูดคุยเพื่อระบายอารมณ์ ผูกพันกับพี่น้องหรือคนใกล้ตัว และใจไวต่อข้อมูลรอบตัว','บ้านและครอบครัวคือที่พักใจที่สำคัญที่สุด คุณผูกพันกับแม่หรือรากเหง้ามาก','คุณมีความสุขเมื่อได้สนุก เล่น และสร้างสรรค์ ความรักทำให้อารมณ์ขึ้นลงมาก และคุณรักเด็ก','อารมณ์ส่งผลต่อสุขภาพและการทำงานโดยตรง คุณรู้สึกมั่นคงเมื่อมีกิจวัตรและได้ดูแลคนอื่น','คุณต้องการคู่ที่ให้ความรู้สึกปลอดภัย อารมณ์ขึ้นกับความสัมพันธ์มาก และมักดูแลคู่เหมือนครอบครัว','อารมณ์ของคุณลึกและเข้มข้น ต้องการความใกล้ชิดทางใจแบบจริงจัง และมักเก็บความรู้สึกไว้ลึก','คุณรู้สึกดีเมื่อได้เดินทาง เรียนรู้ หรือมีความเชื่อยึดเหนี่ยวใจ อาจรู้สึกเหมือนอยู่บ้านเมื่ออยู่ต่างแดน','ชีวิตส่วนตัวกับงานผูกกัน คุณเป็นที่รู้จักในสังคม และงานที่ดูแลผู้คนเหมาะกับคุณ','เพื่อนคือครอบครัวที่คุณเลือกเอง คุณรู้สึกปลอดภัยเมื่ออยู่ในกลุ่มที่เข้าใจกัน','คุณเก็บความรู้สึกไว้ข้างในมาก ต้องการเวลาอยู่คนเดียวเพื่อพักใจ และมีสัญชาตญาณลึก'],
  mercury:['คุณดูหัวไว ช่างพูด ช่างสังเกต และคิดเร็ว ความคิดคือส่วนสำคัญของบุคลิก','คุณหาเงินได้ดีจากความคิด การพูด การเขียน หรือการค้าขาย และคิดเรื่องเงินอย่างเป็นระบบ','ความคิดและการสื่อสารคือจุดแข็งตามธรรมชาติ เรียนรู้เร็ว ชอบอ่าน ชอบคุย และเหมาะกับงานสื่อสาร','คุณคิดมากเรื่องบ้านและครอบครัว ชอบทำงานจากบ้าน และบ้านมักเต็มไปด้วยหนังสือหรือการพูดคุย','คุณคิดสร้างสรรค์ มีอารมณ์ขัน ชอบเกมที่ใช้สมอง และสื่อสารได้สนุก','คุณคิดเป็นระบบ ละเอียดกับงาน และเก่งการวางแผนกิจวัตร แต่อาจกังวลจนเครียด','คุณต้องการคู่ที่คุยกันรู้เรื่อง และเก่งการเจรจาและให้คำปรึกษา','คุณคิดลึก ชอบค้นหาความจริงและเรื่องที่ซ่อนอยู่ เหมาะกับงานวิจัยหรือการเงิน','คุณชอบเรียนรู้เรื่องใหญ่ ปรัชญา ภาษา หรือต่างประเทศ และสื่อสารความคิดได้กว้างไกล','อาชีพของคุณใช้การสื่อสาร ความคิด หรือการเขียน และคุณเป็นที่รู้จักจากคำพูดหรือความคิด','คุณคิดได้ดีที่สุดเมื่อได้แลกเปลี่ยนกับกลุ่มเพื่อน และมีเครือข่ายที่ให้ข้อมูลดี','คุณคิดเงียบ ๆ ในใจ มีจินตนาการและสัญชาตญาณ แต่บางครั้งพูดสิ่งที่คิดออกมาได้ยาก'],
  venus:['คุณมีเสน่ห์ชัดเจน ดูอ่อนโยนและมีรสนิยม คนมักชอบคุณตั้งแต่แรกเห็น','คุณมีรสนิยมในการใช้เงิน ชอบของสวยและมีคุณภาพ และหาเงินได้ดีจากศิลปะ ความงาม หรือการบริการ','คุณพูดจาน่าฟัง เข้ากับพี่น้องและคนรอบตัวได้ดี และความรักมักเริ่มจากการพูดคุย','คุณรักบ้านที่สวยและอบอุ่น ครอบครัวกลมเกลียว และชอบตกแต่งบ้าน','ความรักโรแมนติกเป็นเรื่องสำคัญและสนุก คุณมีเสน่ห์ ชอบศิลปะ และมีความสุขกับงานอดิเรก','คุณชอบที่ทำงานที่บรรยากาศดี เข้ากับเพื่อนร่วมงานได้ และอาจเจอความรักจากที่ทำงาน','ความสัมพันธ์และการแต่งงานสำคัญมากและมักราบรื่น คุณดึงดูดคู่ที่ดีและเก่งการประสานงาน','ความรักของคุณลึกซึ้งและเข้มข้น และอาจได้ประโยชน์ทางการเงินผ่านคู่หรือคนอื่น','คุณอาจตกหลุมรักคนต่างชาติหรือคนที่มีมุมมองต่าง และรักการเดินทางกับศิลปะวัฒนธรรม','คุณมีภาพลักษณ์ดีในสังคม เหมาะกับงานศิลปะ ความงาม หรือการประสานงาน และเป็นที่ชื่นชอบในที่ทำงาน','คุณมีเพื่อนมากและเป็นที่รักในกลุ่ม ความรักอาจเริ่มจากมิตรภาพ','ความรักของคุณเงียบและเสียสละ อาจมีความรักที่เก็บเป็นความลับ และมีความสุขกับศิลปะหรือการได้อยู่เงียบ ๆ'],
  mars:['คุณมีพลังสูง กล้า ตรงไปตรงมา และชอบเป็นคนเริ่ม แต่อาจใจร้อนและดูแข็งกร้าว','คุณขยันหาเงินและลงมือสร้างความมั่นคงเอง แต่ก็อาจใช้เงินเร็วตามใจ','คุณพูดตรง คิดเร็ว ชอบโต้แย้ง และอาจปะทะกับพี่น้องหรือคนใกล้ตัว','คุณทุ่มพลังกับเรื่องบ้าน อาจมีความขัดแย้งในครอบครัว หรือชอบซ่อมแซมและสร้างบ้านเอง','คุณมีพลังในการสร้างสรรค์ กีฬา และความรัก ชอบการแข่งขันและความตื่นเต้น','คุณทำงานหนักและเร็ว ต้องการงานที่ใช้พลัง แต่ต้องระวังความเครียดหรือการบาดเจ็บจากการทำเกินตัว','คุณดึงดูดคู่ที่มีพลังหรือเข้มแข็ง ความสัมพันธ์ตื่นเต้นแต่ก็มีการทะเลาะ ต้องเรียนรู้การประนีประนอม','คุณมีพลังลึกและมุ่งมั่นสูง สนใจเรื่องอำนาจ การเงินร่วม หรือการเปลี่ยนแปลง และมีความต้องการเข้มข้นในความใกล้ชิด','คุณกระตือรือร้นในการเรียนรู้ เดินทาง และปกป้องความเชื่อ อาจเถียงเรื่องหลักการได้แรง','คุณทะเยอทะยานในอาชีพ ชอบแข่งขันและเป็นผู้นำ แต่อาจขัดแย้งกับผู้มีอำนาจ','คุณมีพลังในกลุ่ม ชอบผลักดันโครงการร่วมกับเพื่อน แต่อาจมีความขัดแย้งในกลุ่มบ้าง','พลังและความโกรธมักถูกเก็บไว้ข้างใน ควรหาทางออกที่ดี เช่น การออกกำลังกายหรืองานเบื้องหลังที่มีความหมาย'],
  jupiter:['คุณดูใจดี มองโลกแง่ดี และมีโชค คนรอบตัวอยากช่วยเหลือ โอกาสมักมาจากความมั่นใจของคุณเอง','โอกาสของคุณอยู่ที่เรื่องเงิน คุณหาเงินได้คล่องและมักมีทางให้รายได้เติบโต แต่ก็ใช้จ่ายง่ายเช่นกัน','โอกาสมาจากการเรียนรู้ การพูด การเขียน และเครือข่ายใกล้ตัว พี่น้องหรือเพื่อนบ้านมักช่วยเหลือ','ครอบครัวเป็นแหล่งโชคและความอบอุ่น มีโอกาสได้บ้านหรืออสังหาริมทรัพย์ และชีวิตช่วงหลังดีขึ้น','โชคของคุณอยู่ที่ความรัก ความสนุก ศิลปะ และลูก ยิ่งได้สร้างสรรค์ยิ่งมีโอกาสเข้ามา','คุณมีโชคในงานประจำและเพื่อนร่วมงาน งานที่ช่วยเหลือผู้อื่นทำให้คุณเติบโต แต่ระวังการกินหรือทำงานเกินพอดี','คู่ครองหรือหุ้นส่วนนำโอกาสมาให้ คุณมักเจอคนดีและมีโชคในความสัมพันธ์','คุณมีโอกาสได้ประโยชน์จากเงินของคนอื่น มรดก หรือการลงทุน และผ่านวิกฤตได้ดีอย่างน่าแปลกใจ','ดาวพฤหัสอยู่ในเรือนธรรมชาติของตัวเอง โอกาสมาจากการศึกษา ต่างประเทศ การสอน และความเชื่อ ยิ่งเปิดโลกยิ่งโชคดี','คุณมีโอกาสก้าวหน้าในอาชีพ ได้รับการยอมรับ และมักมีผู้ใหญ่สนับสนุน','โอกาสของคุณมาจากเพื่อนและเครือข่าย ยิ่งรู้จักคนมาก ประตูยิ่งเปิด และความฝันระยะยาวมีโอกาสเป็นจริง','คุณมีโชคแบบมีคนช่วยเงียบ ๆ ในยามลำบาก และเติบโตผ่านการให้ การภาวนา หรือการทำงานเบื้องหลัง'],
  saturn:['คุณดูจริงจัง เป็นผู้ใหญ่ตั้งแต่เด็ก อาจขี้อายหรือระวังตัว แต่ยิ่งโตยิ่งน่าเชื่อถือ','บทเรียนของคุณอยู่ที่เรื่องเงิน อาจกังวลเรื่องความมั่นคง แต่เมื่ออดทนสะสมจะมั่นคงในระยะยาว','คุณคิดรอบคอบ อาจเคยรู้สึกว่าเรียนรู้ช้าหรือไม่กล้าพูด แต่เมื่อฝึกแล้วคำพูดมีน้ำหนักมาก','คุณอาจต้องรับผิดชอบครอบครัวตั้งแต่เด็ก หรือบ้านไม่ค่อยอบอุ่น จึงตั้งใจสร้างบ้านที่มั่นคงด้วยตัวเอง','คุณจริงจังกับความรักและการแสดงออก อาจไม่กล้าสนุกเต็มที่ แต่สร้างงานสร้างสรรค์ที่มีคุณภาพได้เมื่อฝึกฝน','คุณทำงานหนักและรับผิดชอบสูง ต้องระวังความเครียดสะสมและดูแลสุขภาพอย่างสม่ำเสมอ','คุณจริงจังกับความสัมพันธ์ อาจแต่งงานช้าหรือเลือกคู่ที่เป็นผู้ใหญ่ ความสัมพันธ์ยิ่งนานยิ่งมั่นคง','คุณระวังเรื่องการไว้ใจคนและการเงินร่วม การเปลี่ยนแปลงใหญ่ในชีวิตสอนให้คุณแข็งแกร่ง','คุณจริงจังกับความเชื่อและการศึกษา อาจเรียนต่อช้าแต่เข้าใจลึก และมีหลักการชัดเจน','คุณทะเยอทะยานและรับผิดชอบสูงในอาชีพ ความสำเร็จมาช้าแต่มั่นคงและน่านับถือ','คุณมีเพื่อนน้อยแต่จริงใจ อาจรู้สึกไม่เข้าพวกในวัยเด็ก แต่เครือข่ายที่ค่อย ๆ สร้างจะยั่งยืน','คุณอาจมีความกลัวหรือความกังวลลึก ๆ ที่มองไม่เห็น การใช้เวลากับตัวเองหรือการภาวนาช่วยให้ใจมั่นคง'],
  uranus:['คุณดูแปลกใหม่ ไม่เหมือนใคร และไม่ชอบถูกกำหนด','รายได้ของคุณขึ้นลง หรือมาจากทางที่ไม่ธรรมดา เช่น เทคโนโลยีหรืองานอิสระ','คุณคิดแหวกแนว เรียนรู้แบบไม่ตามตำรา และมีไอเดียแปลกใหม่','บ้านหรือครอบครัวของคุณไม่เหมือนใคร อาจย้ายบ้านบ่อย หรือต้องการอิสระจากครอบครัว','ความรักมาแบบไม่คาดฝัน คุณชอบความแปลกใหม่และมีความคิดสร้างสรรค์แหวกแนว','คุณต้องการงานที่ยืดหยุ่น ไม่ชอบกิจวัตรซ้ำซาก และเหมาะกับงานเทคโนโลยี','คุณต้องการความสัมพันธ์ที่ให้อิสระ อาจเจอคู่แบบไม่คาดคิดหรือความสัมพันธ์ไม่ธรรมดา','ชีวิตมีการเปลี่ยนแปลงกะทันหัน การเงินร่วมขึ้นลงได้ และคุณสนใจเรื่องลึกลับแบบมีเหตุผล','คุณมีความเชื่อเป็นของตัวเอง ชอบแนวคิดใหม่ และอาจเดินทางแบบไม่ได้วางแผน','อาชีพของคุณไม่ธรรมดา อาจเปลี่ยนสายงานหลายครั้ง และไม่ชอบทำงานภายใต้คำสั่ง','คุณมีเพื่อนหลากหลายและแปลกใหม่ และชอบรวมกลุ่มเพื่อเปลี่ยนแปลงสังคม','คุณมีความคิดกบฏซ่อนอยู่ข้างใน และมีสัญชาตญาณแบบปิ๊งแวบ'],
  neptune:['คุณดูอ่อนโยน เพ้อฝัน มีเสน่ห์ลึกลับ แต่บางครั้งภาพตัวเองไม่ชัด','คุณไม่ค่อยยึดติดกับเงิน อาจหาเงินจากศิลปะ แต่ต้องระวังการใช้จ่ายสับสนหรือถูกหลอก','คุณคิดเป็นภาพ มีจินตนาการ เขียนหรือเล่าเรื่องเก่ง แต่อาจสื่อสารคลุมเครือ','คุณฝันถึงบ้านที่เป็นที่พักใจ ครอบครัวอาจมีเรื่องที่ไม่ชัดเจนหรือการเสียสละ','คุณมีความคิดสร้างสรรค์สูง โรแมนติก และรักศิลปะ ดนตรี หรือภาพยนตร์','คุณอยากทำงานที่มีความหมายหรือช่วยเหลือผู้อื่น และร่างกายอ่อนไหวต่อสิ่งแวดล้อม','คุณมองคู่ในอุดมคติ อาจเสียสละในความสัมพันธ์ ควรมองความจริงให้ชัด','คุณมีสัญชาตญาณลึกและสนใจเรื่องจิตวิญญาณ ต้องระวังความคลุมเครือในการเงินร่วม','คุณมีความเชื่อทางจิตวิญญาณสูง ฝันถึงการเดินทางไกลและโลกที่ดีกว่า','อาชีพของคุณเกี่ยวกับศิลปะ การช่วยเหลือ หรือความฝัน แต่เป้าหมายอาจไม่ชัดในช่วงแรก','คุณมีอุดมการณ์เพื่อส่วนรวม แต่ต้องระวังการมองเพื่อนในแง่ดีเกินไป','คุณมีโลกภายในลึก สัญชาตญาณแรง และเติบโตผ่านการภาวนาหรือศิลปะ'],
  pluto:['คุณมีบุคลิกเข้มข้น มีพลังดึงดูด และผ่านการเปลี่ยนแปลงตัวเองครั้งใหญ่หลายครั้ง','เรื่องเงินและทรัพย์สินผ่านการขึ้นลงครั้งใหญ่ และคุณมีพลังสร้างความมั่งคั่งขึ้นใหม่','คุณคิดลึก พูดมีพลังโน้มน้าว และชอบค้นหาความจริง','ครอบครัวมีพลังหรือเรื่องราวที่เข้มข้น และบ้านคือสถานที่ที่คุณเปลี่ยนแปลงตัวเอง','ความรักของคุณเข้มข้น และงานสร้างสรรค์มีพลังลึกซึ้ง','คุณทุ่มเทให้งานมาก อยากปรับปรุงทุกอย่างให้ดีขึ้นถึงราก และต้องดูแลทั้งสุขภาพกายและใจ','ความสัมพันธ์ของคุณเข้มข้นและเปลี่ยนชีวิต ต้องระวังเรื่องอำนาจหรือการควบคุมกันในคู่','คุณเข้าใจจิตใจคนลึก มีพลังฟื้นตัวสูง และเก่งเรื่องการเงินหรือการรับมือวิกฤต','ความเชื่อของคุณผ่านการเปลี่ยนแปลงลึก และคุณแสวงหาความจริงอย่างจริงจัง','คุณทะเยอทะยาน อยากมีอิทธิพล และอาชีพมักผ่านการพลิกผันครั้งใหญ่','คุณมีพลังในกลุ่มและเปลี่ยนแปลงสังคมได้ แต่ความสัมพันธ์กับเพื่อนอาจเข้มข้น','คุณมีพลังลึกที่ซ่อนอยู่ข้างใน และเติบโตผ่านการเผชิญความกลัวลึก ๆ ของตัวเอง'],
  node:['ชีวิตชวนให้คุณกล้าเป็นตัวของตัวเองและพึ่งตัวเอง แทนที่จะคอยตามใจคนอื่น','ชีวิตชวนให้คุณสร้างคุณค่าและความมั่นคงด้วยตัวเอง และเรียนรู้ความพอเพียง','ชีวิตชวนให้คุณเรียนรู้ สื่อสาร และรับฟังความเห็นที่หลากหลาย','ชีวิตชวนให้คุณให้ความสำคัญกับบ้าน ครอบครัว และโลกภายใน มากกว่าความสำเร็จภายนอก','ชีวิตชวนให้คุณกล้าแสดงออก สนุก และทำตามหัวใจตัวเอง','ชีวิตชวนให้คุณสร้างกิจวัตรที่ดี ใส่ใจรายละเอียด และช่วยเหลือผู้อื่นอย่างเป็นรูปธรรม','ชีวิตชวนให้คุณเรียนรู้การร่วมมือ การประนีประนอม และการเปิดใจให้คู่','ชีวิตชวนให้คุณกล้าใกล้ชิดกับผู้อื่นอย่างลึกซึ้ง และยอมให้ตัวเองเปลี่ยนแปลง','ชีวิตชวนให้คุณเปิดโลก เดินทาง เรียนรู้ และหาความหมายที่ใหญ่กว่าตัวเอง','ชีวิตชวนให้คุณสร้างเป้าหมายและอาชีพที่มีความหมาย และกล้ารับบทบาทในสังคม','ชีวิตชวนให้คุณเข้าร่วมกลุ่ม แบ่งปันความฝัน และทำเพื่อส่วนรวม','ชีวิตชวนให้คุณวางการควบคุม ฟังเสียงภายใน และพัฒนาจิตใจ'],

/* ---------- time zones ---------- */
function tzOffsetMin(zone, ms) {
  const f = new Intl.DateTimeFormat('en-US',{timeZone:zone,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p = Object.fromEntries(f.formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  const d = new Date(0); d.setUTCFullYear(+p.year, +p.month-1, +p.day); d.setUTCHours(+p.hour%24, +p.minute, +p.second, 0);
  return Math.round((d.getTime() - Math.floor(ms/1000)*1000)/60000);
}
function utcMs(y,mo,d,h,mi) { const t = new Date(0); t.setUTCFullYear(y,mo-1,d); t.setUTCHours(h,mi,0,0); return t.getTime(); }
function localToUTC(y,mo,d,h,mi,loc) {
  const guess = utcMs(y,mo,d,h,mi);
  if (loc.tz == null) return { ms: guess - loc.off*60000, off: loc.off };
  let off = tzOffsetMin(loc.tz, guess), ms = guess - off*60000;
  const off2 = tzOffsetMin(loc.tz, ms);
  if (off2 !== off) { ms = guess - off2*60000; off = off2; }
  return { ms, off };
}
const fmtOff = m => { const s = m<0?'−':'+', a=Math.abs(m); return `UTC${s}${Math.floor(a/60)}${a%60?':'+pad(a%60):''}`; };

/* ---------- chart computation ---------- */
const sep = (a,b) => { const d = Math.abs(norm(a-b)); return d>180 ? 360-d : d; };
function compute(inp) {
  const jd = inp.ms/86400000 + 2440587.5;
  const L0 = longitudes(jd), Lb = longitudes(jd-0.5), La = longitudes(jd+0.5);
  const lons = {}, retro = {};
  for (const p of PLANETS) {
    lons[p.k] = L0[p.k];
    retro[p.k] = !['sun','moon','node'].includes(p.k) && norm(La[p.k]-Lb[p.k]) > 180;
  }
  let asc=null, mc=null, cusps=null, houseNote='';
  if (inp.timeKnown) {
    const an = angles(jd, inp.lat, inp.lon);
    asc = an.asc; mc = an.mc;
    let sys = inp.houses;
    if (sys === 'placidus') {
      const pl = placidus(an.ramc, an.eps, inp.lat);
      if (pl) cusps = [asc, pl.c2, pl.c3, mc+180, pl.c11+180, pl.c12+180, asc+180, pl.c2+180, pl.c3+180, mc, pl.c11, pl.c12].map(norm);
      else { sys = 'whole'; houseNote = 'ระบบ Placidus ใช้ไม่ได้ในพื้นที่ใกล้ขั้วโลก จึงใช้ระบบ Whole Sign แทน'; }
    }
    if (sys === 'whole') cusps = Array.from({length:12},(_,i)=>norm(Math.floor(asc/30)*30 + 30*i));
    if (sys === 'equal') cusps = Array.from({length:12},(_,i)=>norm(asc + 30*i));
  }
  const houseOf = lon => {
    if (!cusps) return null;
    for (let i=0;i<12;i++) { const a=cusps[i], b=cusps[(i+1)%12]; if (norm(lon-a) < norm(b-a)) return i+1; }
    return 1;
  };
  const points = PLANETS.filter(p=>p.k!=='node').map(p=>({...p, lon:lons[p.k]}));
  if (asc!=null) points.push({k:'asc',...POINTS_INFO.asc,lon:asc},{k:'mc',...POINTS_INFO.mc,lon:mc});
  const aspects = [];
  for (let i=0;i<points.length;i++) for (let j=i+1;j<points.length;j++) {
    if (points[i].k==='asc' && points[j].k==='mc') continue;
    const s = sep(points[i].lon, points[j].lon);
    for (const A of ASPECTS) { const orb = Math.abs(s-A.a); if (orb <= A.orb) aspects.push({p:points[i],q:points[j],A,orb}); }
  }
  aspects.sort((x,y)=>x.orb-y.orb);
  aspects.forEach((a,i)=>a.id='as-'+i);
  const core = PLANETS.filter(p=>p.k!=='node');
  const group = f => { const g={}; core.forEach(p=>{ const k=f(lons[p.k]); if (k!=null) (g[k]=g[k]||[]).push(p); }); return Object.entries(g).filter(([,a])=>a.length>=3).map(([k,a])=>({k:+k, ps:a})); };
  const stSigns = group(l=>Math.floor(norm(l)/30)), stHouses = cusps ? group(houseOf) : [];
  return { jd, lons, retro, asc, mc, cusps, houseOf, aspects, houseNote, stSigns, stHouses };
}

/* ---------- wheel ---------- */
const C = 320, R_OUT = 290, R_ZOD = 250, R_PL = 223, R_DEG = 197, R_HO = 176, R_HI = 150;
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent && parent.appendChild(e); return e;
}
function clickable(node, tab, id, label) {
  node.setAttribute('tabindex','0'); node.setAttribute('role','button'); node.setAttribute('aria-label',label);
  node.addEventListener('click', ()=>openItem(tab,id));
  node.addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' ') { e.preventDefault(); openItem(tab,id); } });
}
function drawWheel(ch) {
  const svg = $('wheel'); svg.innerHTML = '';
  const base = ch.asc != null ? ch.asc : 0;
  const ang = lon => (lon - base + 180) * D2R;
  const P = (r, lon) => [C + r*Math.cos(ang(lon)), C - r*Math.sin(ang(lon))];
  const xy = (r, lon) => { const [x,y] = P(r,lon); return {x:x.toFixed(2), y:y.toFixed(2)}; };
  const seg = (r1, l1, r2, l2, attrs, g) => { const a=P(r1,l1), b=P(r2,l2); return el('line',{x1:a[0].toFixed(2),y1:a[1].toFixed(2),x2:b[0].toFixed(2),y2:b[1].toFixed(2),...attrs},g||svg); };
  const line = (r1, r2, lon, cls, g) => seg(r1, lon, r2, lon, {class:cls}, g);

  for (let i=0;i<12;i++) {
    const pts = [];
    for (let l=i*30; l<=i*30+30; l+=2) pts.push(P(R_OUT,l));
    for (let l=i*30+30; l>=i*30; l-=2) pts.push(P(R_ZOD,l));
    el('polygon',{points:pts.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' '),class:i%2?'w-band2':'w-band'},svg);
    line(R_ZOD, R_OUT, i*30, 'w-line');
    const t = el('text',{...xy((R_OUT+R_ZOD)/2, i*30+15),class:'w-sign'},svg, SIGNS[i].g);
    el('title',{},t,`ราศี${SIGNS[i].th} (${SIGNS[i].en})`);
  }
  for (let l=0;l<360;l++) { if (l%30===0) continue; line(R_ZOD, R_ZOD-(l%5===0?7:3.5), l, 'w-tick'); }
  const band = (r1, r2, l1, l2, cls, label) => { const pts=[]; const span=norm(l2-l1)||360;
    for (let x=0;x<=span;x+=1.5) pts.push(P(r1,l1+x)); pts.push(P(r1,l1+span));
    for (let x=span;x>=0;x-=1.5) pts.push(P(r2,l1+x)); pts.push(P(r2,l1));
    const g = el('polygon',{points:pts.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' '),class:cls},svg); el('title',{},g,label); };
  ch.stSigns.forEach(st=>band(R_OUT, R_OUT+5, st.k*30, st.k*30+30, 'w-st', `สเตเลียมในราศี${SIGNS[st.k].th}`));
  if (ch.cusps) ch.stHouses.forEach(st=>band(R_HI, R_HO, ch.cusps[st.k-1], ch.cusps[st.k%12], 'w-sth', `สเตเลียมในเรือน ${st.k}`));
  el('circle',{cx:C,cy:C,r:R_OUT,class:'w-ink'},svg);
  el('circle',{cx:C,cy:C,r:R_ZOD,class:'w-ink'},svg);
  el('circle',{cx:C,cy:C,r:R_HI,class:'w-line'},svg);

  if (ch.cusps) {
    el('circle',{cx:C,cy:C,r:R_HO,class:'w-line'},svg);
    ch.cusps.forEach((c,i)=>{
      const next = ch.cusps[(i+1)%12];
      if (i%3!==0) line(R_HI, R_ZOD, c, 'w-cusp');
      const g = el('g',{class:'w-hclick'},svg);
      const mid = c + norm(next-c)/2, pos = xy((R_HO+R_HI)/2, mid);
      el('circle',{cx:pos.x,cy:pos.y,r:11,fill:'transparent'},g);
      el('text',{...pos,class:'w-house'},g, String(i+1));
      clickable(g,'houses','ho-'+(i+1),`เรือน ${i+1} ${HOUSES[i].t}`);
    });
    [[ch.asc,'AC','pl-asc'],[ch.mc,'MC','pl-mc'],[ch.asc+180,'DC',null],[ch.mc+180,'IC',null]].forEach(([l,t,id])=>{
      line(R_HI, R_OUT+8, l, 'w-axis');
      const tx = el('text',{...xy(R_OUT+20,l),class:'w-axlbl'},svg,t);
      if (id) { tx.classList.add('w-click'); clickable(tx,'planets',id, t==='AC'?'ลัคนา':'กลางฟ้า'); }
    });
  }

  const ag = el('g',{class:'w-aspects'},svg);
  for (const a of ch.aspects) {
    if (a.A.c==='conj' || ['asc','mc'].includes(a.p.k) || ['asc','mc'].includes(a.q.k)) continue;
    seg(R_HI-2, a.p.lon, R_HI-2, a.q.lon, {class:a.A.c==='tense'?'w-a-t':'w-a-h','stroke-width':(1.6-a.orb*0.12).toFixed(2),opacity:(1-a.orb/10).toFixed(2)}, ag);
    const hit = seg(R_HI-2, a.p.lon, R_HI-2, a.q.lon, {class:'w-hit'}, ag);
    el('title',{},hit,`${a.p.th} ${a.A.n} ${a.q.th}`);
    clickable(hit,'aspects',a.id,`${a.p.th} ${a.A.n} ${a.q.th}`);
  }

  const pg = el('g',{class:'w-planets'},svg);
  const items = PLANETS.map(p=>({p, lon:ch.lons[p.k], d:ch.lons[p.k]})).sort((a,b)=>a.lon-b.lon);
  const MIN = 8.5;
  let gi = 0, gmax = -1;
  for (let i=0;i<items.length;i++) { const g = norm(items[(i+1)%items.length].lon - items[i].lon); if (g>gmax) { gmax=g; gi=i; } }
  const seq = items.slice(gi+1).concat(items.slice(0, gi+1)), base0 = seq[0].lon;
  seq.forEach(it=>{ it.d = base0 + norm(it.lon - base0); });
  for (let it=0; it<400; it++) {
    let moved = false;
    for (let i=0;i<seq.length-1;i++) { const gap = seq[i+1].d - seq[i].d; if (gap < MIN-1e-6) { const push=(MIN-gap)/2; seq[i].d -= push; seq[i+1].d += push; moved = true; } }
    if (!moved) break;
  }
  for (const it of items) {
    line(R_ZOD, R_ZOD-9, it.lon, 'w-ptick', pg);
    if (sep(it.d, it.lon) > 1) seg(R_ZOD-9, it.lon, R_PL+12, it.d, {class:'w-conn'}, pg);
    const g = el('g',{class:'w-click'+(kumAsc(ch,it.p.k)||kumMc(ch,it.p.k)?' w-kum':'')},pg), pos = xy(R_PL,it.d);
    el('circle',{cx:pos.x,cy:pos.y,r:13},g);
    el('text',{...pos,class:'w-pl'},g,it.p.g);
    el('text',{...xy(R_DEG,it.d),class:'w-deg'},g, Math.floor(norm(it.lon)%30)+'°'+(ch.retro[it.p.k]?'R':''));
    el('title',{},g,`${it.p.th} ${degStr(it.lon)} ราศี${signOf(it.lon).th}`);
    clickable(g,'planets','pl-'+it.p.k,`${it.p.th} ราศี${signOf(it.lon).th}`);
  }
}

    const rules = HR.filter(R=>R.r===p.k);
    if (rules.length) body += `<p><b>เป็นเจ้าเรือน ${rules.map(R=>R.h).join(' และ ')}</b> ${rules.map(R=> R.rh===R.h ? `${p.th}อยู่ในเรือน ${R.h} ที่ตัวเองเป็นเจ้าของ เรื่อง${HOUSES[R.h-1].t}จึงแข็งแรงเป็นพิเศษ` : `${p.th}พาเรื่อง${HOUSES[R.h-1].t} (เรือน ${R.h}) มาเชื่อมกับเรือน ${h} หมายความว่า${H_WHAT[R.h-1]}มักได้ผลผ่าน${H_VIA[h-1]}`).join(' ')}</p>`;
    if (p.k==='asc' && HR.length) { const r = HR[0]; body += `<p><b>ดาวเจ้าชะตา</b> เจ้าราศี${s.th}คือ${lk('planets','pl-'+r.r,PK[r.r].th)} อยู่เรือน ${r.rh} ชีวิตโดยรวมของคุณจึงหมุนรอบเรื่อง${HOUSES[r.rh-1].t}เป็นพิเศษ</p>`; }
    if (st.length) body += `<p><b>อยู่ในสเตเลียม (${st.join(' และ ')})</b> ดาวดวงนี้รวมกลุ่มกับดาวอื่นอีกหลายดวง พลังจึงไม่ทำงานเดี่ยว ๆ แต่ผสมกับดาวในกลุ่มจนเป็นเรื่องเด่นของดวง</p>`;
    const al = aspLinks(ch, p.k);
    if (al) body += `<p><b>มุมกับดาวอื่น</b> ${al}</p>`;
    if (rx) body += `<p><b>เดินถอยหลัง (Retrograde)</b> ตอนคุณเกิด ดาวนี้ดูเหมือนเดินถอยหลังเมื่อมองจากโลก นักโหราศาสตร์มองว่าพลังด้านนี้หันเข้าด้านใน คุณอาจคิดทบทวนหลายรอบก่อนแสดงออก และพัฒนาด้านนี้ในแบบของตัวเอง</p>`;
    html += item('pl-'+p.k, sum, body);
  }
  html += '</div>';
  if (ch.asc==null) html += `<p class="empty">ใส่เวลาเกิดเพื่อดูลัคนา กลางฟ้า และเรือนที่ดาวแต่ละดวงอยู่</p>`;
  $('p-planets').innerHTML = html;
}

function renderHouses(inp, ch) {
  let html = `<p class="intro">วงดวงแบ่งเป็น 12 เรือน แต่ละเรือนคือเรื่องหนึ่งของชีวิต ดาวในเรือนบอกว่าเรื่องนั้นมีพลังอะไรเข้ามาเกี่ยว ส่วน<b>เจ้าราศี</b>ของราศีที่เริ่มต้นเรือน (ดาวที่เป็นเจ้าของราศีนั้น) จะพาเรื่องของเรือนนี้ไปเชื่อมกับเรือนที่ดาวดวงนั้นอยู่ ใช้อ่านได้ทุกเรือน และสำคัญเป็นพิเศษกับเรือนที่ไม่มีดาว</p>`;
  if (!ch.cusps) { $('p-houses').innerHTML = html + `<p class="empty">เรือนคำนวณจากเวลาและสถานที่เกิด ใส่เวลาเกิดแล้วกด ดูดวงกำเนิด อีกครั้งเพื่อดูเรือนทั้ง 12</p>`; return; }
  html += '<div class="list">';
  const inHouse = Array.from({length:12},()=>[]);
  PLANETS.forEach(p=>inHouse[ch.houseOf(ch.lons[p.k])-1].push(p));
  const HR = houseRulers(ch);
  ch.cusps.forEach((c,i)=>{
    const s = signOf(c), H = HOUSES[i], ps = inHouse[i], R = HR[i], st = ch.stHouses.find(x=>x.k===i+1);
    const sum = `<span class="gl num" style="font-family:var(--display);font-size:18px">${i+1}</span><span><span class="sm-name">${H.t}</span>${ps.length?`<span class="cnt">${ps.length} ดาว</span>`:''}${st?'<span class="tag n-m">สเตเลียม</span>':''}<br><span class="sm-sub">ราศี${s.th} เจ้าราศีอยู่เรือน ${R.rh}</span></span><span class="sm-right sg" style="font-size:17px">${ps.map(p=>p.g).join(' ')}</span>`;
    let body = `<p class="sub">เรือนนี้เกี่ยวกับ${H.d}</p><p><b>เริ่มต้นที่ราศี${s.th} (${s.en})</b> คุณรับมือกับเรื่องนี้แบบ${s.style}</p>`;
    if (ps.length) {
      body += `<p><b>ดาวในเรือนนี้</b></p><ul class="pl">${ps.map(p=>`<li>${lk('planets','pl-'+p.k,p.th)} ${PH[p.k][i]}</li>`).join('')}</ul>`;
      if (st) body += `<p><b>สเตเลียม</b> มีดาว ${st.ps.length} ดวงรวมอยู่ในเรือนนี้ เรื่อง${H.t}จึงเป็นเวทีหลักของชีวิตคุณ พลังของดาวเหล่านี้ผสมกันและแสดงออกผ่าน${H_VIA[i]}เป็นพิเศษ</p>`;
    } else body += `<p><b>ไม่มีดาวในเรือนนี้</b> ไม่ได้แปลว่าเรื่องนี้ไม่สำคัญหรือไม่ดี ให้ดูจากเจ้าราศีของเรือนแทน</p>`;
    body += `<div class="rbox"><b>เจ้าราศีของเรือนนี้</b> ${rulerText(ch, R)} ${lk('planets','pl-'+R.r,`อ่านเรื่อง${PK[R.r].th}`)}</div>`;
    html += item('ho-'+(i+1), sum, body);
  });
  $('p-houses').innerHTML = html + '</div>';
}

function renderSummary(inp, ch) {
  const L = ch.lons, hk = k => ch.houseOf(L[k]);
  const sun = signOf(L.sun), moon = signOf(L.moon);
  let html = `<p class="intro">หน้านี้รวมดาว ราศี เรือน และมุมเข้าด้วยกัน เพื่อให้เห็นภาพใหญ่ของดวงในที่เดียว กดชื่อดาวหรือมุมเพื่ออ่านรายละเอียด</p>`;

  // ตัวตน
  html += `<section class="sec" id="sum-top"><h3>ตัวตนของคุณ</h3>`;
  html += `<p>แก่นแท้ของคุณคือคน${sun.kw} (${lk('planets','pl-sun',`ดวงอาทิตย์ราศี${sun.th}`)}${hk('sun')?` เรือน ${hk('sun')}`:''})${hk('sun')?` ${PH.sun[hk('sun')-1]}`:''}</p>`;
  html += `<p>ด้านอารมณ์ ใจของคุณรู้สึกและตอบสนองแบบ${moon.style} (${lk('planets','pl-moon',`ดวงจันทร์ราศี${moon.th}`)}${hk('moon')?` เรือน ${hk('moon')}`:''})${hk('moon')?` ${PH.moon[hk('moon')-1]}`:''}</p>`;
  const HR = houseRulers(ch);
  if (ch.asc!=null) {
    const a = signOf(ch.asc), r = HR[0], rs = signOf(L[r.r]);
    html += `<p>ภายนอก คนมักเห็นคุณเป็นคน${a.style} (${lk('planets','pl-asc',`ลัคนาราศี${a.th}`)}) ดาวเจ้าชะตาของคุณคือ${lk('planets','pl-'+r.r,PK[r.r].th)} อยู่ราศี${rs.th} เรือน ${r.rh} ชีวิตโดยรวมจึงหมุนรอบเรื่อง${HOUSES[r.rh-1].t}เป็นพิเศษ ${PH[r.r][r.rh-1]}</p>`;
  } else html += `<p class="sub">ใส่เวลาเกิดเพื่อดูลัคนา ดาวกุมลัคนา ดาวเจ้าชะตา และเรือน ซึ่งทำให้ภาพตัวตนครบขึ้น</p>`;
  const kA = kumList(ch, kumAsc), kM = kumList(ch, kumMc);
  if (ch.asc!=null) html += kA.length
    ? `<p><b>ดาวกุมลัคนา</b> ${KUM_INTRO}</p><ul class="hl">${kA.map(x=>`<li><span class="tag n-k">กุมลัคนา</span> <b>${lk('planets','pl-'+x.p.k,x.p.th)}</b> ${kumText(ch,x.p,x.r)}</li>`).join('')}</ul>`
    : `<p class="sub">ไม่มีดาวกุมลัคนา บุคลิกภายนอกของคุณจึงเป็นไปตามราศีลัคนา${signOf(ch.asc).th}เป็นหลัก</p>`;
  if (kM.length) html += `<p><b>ดาวกุมกลางฟ้า</b> ดาวที่อยู่จุดสูงสุดของท้องฟ้าตอนคุณเกิดจะเด่นในเรื่องอาชีพและภาพลักษณ์ในสังคม</p><ul class="hl">${kM.map(x=>`<li><span class="tag n-k">กุมกลางฟ้า</span> <b>${lk('planets','pl-'+x.p.k,x.p.th)}</b> ${mcText(x.p,x.r)}</li>`).join('')}</ul>`;
  const coreAsp = ch.aspects.filter(a=>a.orb<=5 && ['sun','moon','asc'].some(k=>a.p.k===k||a.q.k===k) && !(a.A.c==='conj' && ['asc','mc'].some(k=>a.p.k===k||a.q.k===k))).slice(0,3);
  if (coreAsp.length) html += `<p><b>มุมที่หล่อหลอมตัวตน</b></p><ul class="hl">${coreAsp.map(a=>{const X=aspectText(a); return `<li><span class="tag n-${X.nature}">${NATURE[X.nature]}</span> ${lk('aspects',a.id,`${a.p.th} ${a.A.n} ${a.q.th}`)} ${X.main}</li>`;}).join('')}</ul>`;
  html += `</section>`;

  // จุดเด่นของดวง
  const hi = [];
  ch.stSigns.forEach(st=>{ const S=SIGNS[st.k]; hi.push(`<b>สเตเลียมในราศี${S.th}</b> ${st.ps.map(p=>lk('planets','pl-'+p.k,p.th)).join(' ')} รวมกัน ${st.ps.length} ดวง คุณจึงมีความเป็นราศี${S.th}เข้มข้นมาก คือ${S.kw} มากกว่าที่ราศีอาทิตย์บอกไว้`); });
  ch.stHouses.forEach(st=>{ hi.push(`<b>สเตเลียมในเรือน ${st.k} (${HOUSES[st.k-1].t})</b> ${st.ps.map(p=>lk('planets','pl-'+p.k,p.th)).join(' ')} รวมกันในเรือนนี้ ชีวิตคุณจึงทุ่มพลังกับ${H_VIA[st.k-1]}เป็นพิเศษ ${lk('houses','ho-'+st.k,'อ่านเรือนนี้')}`); });
  if (ch.asc!=null) {
    const angs = [];
    kA.forEach(x=>angs.push({p:x.p,l:'กุมลัคนา'})); kM.forEach(x=>angs.push({p:x.p,l:'กุมกลางฟ้า'}));
    PLANETS.filter(p=>p.k!=='node').forEach(p=>{
      [['ใกล้จุดตก (DC)',ch.asc+180],['ใกล้จุดฟ้าต่ำ (IC)',ch.mc+180]].forEach(([l,v])=>{ if (sep(L[p.k],v)<=8) angs.push({p,l}); });
    });
    if (angs.length) hi.push(`<b>ดาวบนมุมหลักของดวง</b> ${angs.map(x=>`${lk('planets','pl-'+x.p.k,x.p.th)}${x.l}`).join(', ')} ดาวที่อยู่ใกล้มุมหลักมีพลังเด่นมาก แสดงออกชัดในบุคลิกและเหตุการณ์ชีวิต`);
  }
  const els = {fire:0,earth:0,air:0,water:0}; PLANETS.filter(p=>p.k!=='node').forEach(p=>els[signOf(L[p.k]).el]++);
  const eMax = Math.max(...Object.values(els)), eTop = Object.keys(els).filter(k=>els[k]===eMax);
  hi.push(`<b>ธาตุเด่น: ${eTop.map(k=>'ธาตุ'+ELEM[k].n).join(' และ ')}</b> คุณจึงเป็นคน${eTop.map(k=>ELEM[k].d).join(' และ')}`);
  if (ch.cusps) {
    const cnt = Array(12).fill(0); PLANETS.filter(p=>p.k!=='node').forEach(p=>cnt[hk(p.k)-1]++);
    const mx = Math.max(...cnt), top = cnt.map((c,i)=>[c,i]).filter(x=>x[0]===mx && mx>=2).map(x=>x[1]+1);
    if (top.length && !ch.stHouses.length) hi.push(`<b>เรือนที่มีดาวมากที่สุด</b> ${top.map(h=>`${lk('houses','ho-'+h,`เรือน ${h} ${HOUSES[h-1].t}`)}`).join(' และ ')} เป็นเรื่องที่ชีวิตให้น้ำหนักมาก`);
  }
  if (!ch.stSigns.length && !ch.stHouses.length) hi.push(`<b>ไม่มีสเตเลียม</b> ไม่มีดาว 3 ดวงขึ้นไปรวมกันในราศีหรือเรือนเดียว พลังของคุณจึงกระจายไปหลายด้าน เป็นคนรอบด้านมากกว่าเจาะลึกเรื่องเดียว`);
  { const wp = workProfile(ch); hi.push(`<b>สไตล์การทำงาน: ${soloLabel(wp.pct)}</b> บทบาทเด่นในทีมคือ${ROLE_EL[wp.el].n} ${lk('work','work-top','ดูการทำงานและความเข้ากัน')}`); }
  html += `<section class="sec"><h3>จุดเด่นของดวง</h3><ul class="hl">${hi.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;

  // จุดแข็ง
  const strong = [];
  PLANETS.forEach(p=>{ const d = dignity(p.k, L[p.k]); if (d && DT[d].good) strong.push(`${lk('planets','pl-'+p.k,p.th)} ${DT[d].n} ในราศี${signOf(L[p.k]).th} ด้าน${p.theme}ของคุณจึงทำงานได้ดีเป็นธรรมชาติ`); });
  ch.aspects.filter(a=>a.orb<=5 && !GEN_STRONG.has(a.p.k+'-'+a.q.k) && aspectText(a).nature==='e').slice(0,4)
    .forEach(a=>strong.push(`${lk('aspects',a.id,`${a.p.th} ${a.A.n} ${a.q.th}`)} ${aspectText(a).main}`));
  if (ch.cusps) HR.filter(R=>R.rh===R.h).forEach(R=>strong.push(`เจ้าเรือน ${R.h} (${PK[R.r].th}) อยู่ในเรือนตัวเอง เรื่อง${HOUSES[R.h-1].t}จึงมั่นคงและพึ่งตัวเองได้`));
  html += `<section class="sec"><h3>จุดแข็ง</h3>${strong.length?`<ul class="hl good">${strong.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="sub">ไม่มีตำแหน่งที่โดดเด่นเป็นพิเศษ จุดแข็งของคุณกระจายอยู่ในหลายด้านตามที่อ่านในแท็บอื่น</p>'}</section>`;

  // จุดอ่อน
  const weak = [];
  PLANETS.forEach(p=>{ const d = dignity(p.k, L[p.k]); if (d && !DT[d].good) weak.push(`${lk('planets','pl-'+p.k,p.th)} ${DT[d].n} ในราศี${signOf(L[p.k]).th} ด้าน${p.theme}อาจรู้สึกไม่ลงตัวและต้องใช้ความพยายามมากกว่าคนอื่น`); });
  Object.keys(els).filter(k=>els[k]===0).forEach(k=>weak.push(`ไม่มีดาวในธาตุ${ELEM[k].n} ด้านที่${ELEM[k].d}อาจไม่ใช่สิ่งที่คุณทำได้เองโดยธรรมชาติ ต้องตั้งใจฝึกหรือหาคนที่มีด้านนี้มาช่วย`));
  Object.keys(els).filter(k=>els[k]>=5).forEach(k=>weak.push(`ธาตุ${ELEM[k].n}มากเป็นพิเศษ (${els[k]} ดวง) จุดแข็งนี้อาจกลายเป็นจุดอ่อนได้ถ้าใช้มากเกินไป ควรหาสมดุลกับธาตุอื่น`));
  html += `<section class="sec"><h3>จุดอ่อนที่ควรรู้</h3>${weak.length?`<ul class="hl bad">${weak.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="sub">ไม่มีดาวตกที่หรือธาตุที่ขาดหายไป ดวงค่อนข้างสมดุล</p>'}</section>`;

  // โอกาส
  const opp = [];
  const jh = hk('jupiter'), js = signOf(L.jupiter);
  opp.push(`${lk('planets','pl-jupiter','ดาวพฤหัส')}ในราศี${js.th}${jh?` เรือน ${jh}`:''} คุณเติบโตและคว้าโอกาสในแบบ${js.style}${jh?` ${PH.jupiter[jh-1]}`:''}`);
  const nh = hk('node'); opp.push(`${lk('planets','pl-node','โหนดเหนือ')}ในราศี${signOf(L.node).th}${nh?` เรือน ${nh} ${PH.node[nh-1]}`:` ชีวิตชวนให้คุณเติบโตไปเป็นคน${signOf(L.node).style}`}`);
  ch.aspects.filter(a=>['jupiter','venus'].some(k=>a.p.k===k||a.q.k===k) && a.orb<=6 && aspectText(a).nature==='e' && !GEN_MILD.has(a.p.k+'-'+a.q.k)).slice(0,2)
    .forEach(a=>opp.push(`${lk('aspects',a.id,`${a.p.th} ${a.A.n} ${a.q.th}`)} ${aspectText(a).main}`));
  html += `<section class="sec"><h3>โอกาส</h3><ul class="hl good">${opp.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;

  // ความท้าทาย
  const ch2 = [];
  const sh = hk('saturn'), ss = signOf(L.saturn);
  ch2.push(`${lk('planets','pl-saturn','ดาวเสาร์')}ในราศี${ss.th}${sh?` เรือน ${sh}`:''} คุณสร้างความมั่นคงและรับผิดชอบแบบ${ss.style}${sh?` ${PH.saturn[sh-1]}`:''}`);
  ch.aspects.filter(a=>a.orb<=5 && !GEN_STRONG.has(a.p.k+'-'+a.q.k) && aspectText(a).nature==='h').slice(0,4)
    .forEach(a=>ch2.push(`${lk('aspects',a.id,`${a.p.th} ${a.A.n} ${a.q.th}`)} ${aspectText(a).main}`));
  html += `<section class="sec"><h3>ความท้าทายและบทเรียน</h3><ul class="hl bad">${ch2.map(x=>`<li>${x}</li>`).join('')}</ul><p class="sub">ความท้าทายในดวงไม่ใช่เรื่องร้าย แต่เป็นจุดที่ชีวิตผลักให้คุณเติบโต คนจำนวนมากพบว่าจุดเหล่านี้กลายเป็นจุดแข็งที่สุดเมื่ออายุมากขึ้น</p></section>`;

  $('p-summary').innerHTML = html;

function renderAspects(inp, ch) {
  let html = `<p class="intro">มุมคือระยะห่างระหว่างดาวสองดวงบนวงดวง บางระยะทำให้พลังของสองดาวช่วยกัน บางระยะทำให้ขัดกัน ความหมายจึงขึ้นกับทั้งชนิดของมุมและคู่ดาว เช่น มุมร่วมของดาวศุกร์กับดาวพฤหัสมักเป็นผลดี แต่มุมร่วมของดวงอาทิตย์กับดาวเสาร์เป็นบทเรียนที่ต้องใช้เวลา ตัวเลข <b>คลาด</b> ยิ่งน้อย มุมยิ่งชัดและมีผลมาก</p>`;
  html += `<div class="legend">${ASPECTS.map(A=>`<div class="c-${A.c}"><b>${A.n} ${A.a}°</b> ${A.kind}<br>${A.d}</div>`).join('')}</div>`;
  if (!ch.aspects.length) { $('p-aspects').innerHTML = html + '<p class="empty">ไม่พบมุมหลักในดวงนี้</p>'; return; }
  html += '<div class="list">';
  for (const a of ch.aspects) {
    const strength = a.orb < 2 ? 'ชัดมาก' : a.orb < 5 ? 'ชัด' : 'มีผลเบา ๆ';
    const X = aspectText(a);
    const sum = `<span class="gl c-${a.A.c}" style="color:var(--c);font-family:var(--body);font-size:13px;font-weight:600">${a.A.a}°</span><span><span class="sm-name">${a.p.th} <span class="asp-name c-${a.A.c}">${a.A.n}</span> ${a.q.th}</span><br><span class="sm-sub">${a.p.theme} กับ ${a.q.theme}</span><span class="tag n-${X.nature}">${NATURE[X.nature]}</span></span><span class="sm-right">คลาด <span class="num">${a.orb.toFixed(1)}°</span></span>`;
    const body = `${X.html}<p>มุมนี้คลาด ${a.orb.toFixed(1)}° ถือว่า${strength}</p>`;
    html += item(a.id, sum, body);
  }
  $('p-aspects').innerHTML = html + '</div>';
}

const W_PL = {sun:3,moon:2,mercury:1.5,venus:1,mars:2,jupiter:1,saturn:1,uranus:.5,neptune:.5,pluto:.5};
const H_TEAM = [-2,-.5,1,-.5,.5,-.5,2,-.5,0,0,2,-1.5];
const S_TEAM = [-1,-.5,1,.5,.5,-1,1.5,-1,0,-.5,1,.5];
function elemCount(ch) {
  const e = {fire:0,earth:0,air:0,water:0}, m = {cardinal:0,fixed:0,mutable:0};
  PLANETS.filter(p=>p.k!=='node').forEach(p=>{ const s=signOf(ch.lons[p.k]); e[s.el]++; m[s.mod]++; });
  if (ch.asc!=null) { const s=signOf(ch.asc); e[s.el]++; m[s.mod]++; }
  return {e, m};
}
const topKey = o => Object.keys(o).sort((a,b)=>o[b]-o[a])[0];
function workProfile(ch) {
  const f = []; let sum = 0;
  for (const p of PLANETS) {
    if (p.k==='node') continue;
    const w = W_PL[p.k]*0.6, l = ch.lons[p.k], si = Math.floor(norm(l)/30);
    const sv = S_TEAM[si]*w; sum += sv;
    if (Math.abs(sv) >= 0.9) f.push({v:sv, t:`${p.th}ในราศี${SIGNS[si].th}`});
    if (ch.cusps) { const h = ch.houseOf(l), hv = H_TEAM[h-1]*w; sum += hv; if (Math.abs(hv) >= 0.9) f.push({v:hv, t:`${p.th}ในเรือน ${h} (${HOUSES[h-1].t})`}); }
  }
  if (ch.asc!=null) {
    const si = Math.floor(norm(ch.asc)/30), v = S_TEAM[si]*1.2; sum += v;
    if (Math.abs(v) >= 0.9) f.push({v, t:`ลัคนาราศี${SIGNS[si].th}`});
    let east=0, west=0; PLANETS.filter(p=>p.k!=='node').forEach(p=>{ const h=ch.houseOf(ch.lons[p.k]); if (h>=4&&h<=9) west++; else east++; });
    const hv = (west-east)*0.35; sum += hv;
    if (Math.abs(west-east) >= 4) f.push({v:hv, t: west>east ? `ดาวส่วนใหญ่ (${west} ดวง) อยู่ซีกตะวันตกของดวง ซึ่งเป็นซีกของผู้อื่น` : `ดาวส่วนใหญ่ (${east} ดวง) อยู่ซีกตะวันออกของดวง ซึ่งเป็นซีกของตัวเอง`});
  }
  const scale = ch.cusps ? 9 : 5;
  const pct = Math.round(Math.max(3, Math.min(97, 50 + 50*Math.tanh((sum - (ch.cusps ? 1.2 : 0.6))/scale))));
  const {e, m} = elemCount(ch);
  return {pct, f, e, m, el:topKey(e), mod:topKey(m)};
}

function synastry(A, B, nA, nB) {
  const list = [];
  for (const a of SYN_SET) for (const b of SYN_SET) {
    const s = sep(A.lons[a], B.lons[b]);
    for (const asp of ASPECTS) {
      const orb = Math.abs(s-asp.a); if (orb > SYN_ORB[asp.a]) continue;
      const ia = SYN_SET.indexOf(a), ib = SYN_SET.indexOf(b), fwd = ia<=ib;
      const T = SYN[fwd ? a+'-'+b : b+'-'+a], first = fwd ? nA : nB, second = fwd ? nB : nA;
      const nature = asp.c==='conj' ? T[0] : asp.c==='harm' ? 'e' : 'h';
      const txt = (asp.c==='conj' ? T[3] : asp.c==='harm' ? T[1] : T[2]).replaceAll('{1}', first).replaceAll('{2}', second);
      const w = (SYN_W[a]+SYN_W[b])/2 * (1 - orb/(SYN_ORB[asp.a]+1));
      list.push({a, b, asp, orb, nature, txt, w});
    }
  }
  list.sort((x,y)=>y.w-x.w);
  const val = x => x.w * (x.nature==='e' ? 1 : x.nature==='h' ? -0.85 : 0.35);
  const sub = keys => list.filter(x=>keys.includes(x.a)||keys.includes(x.b)).reduce((s,x)=>s+val(x),0);
  const pA = workProfile(A), pB = workProfile(B);
  const cr = COMM_REL[elRel(signOf(A.lons.mercury).el, signOf(B.lons.mercury).el)];
  const pr = PACE_REL[elRel(signOf(A.lons.mars).el, signOf(B.lons.mars).el)];
  const mk = [pA.mod, pB.mod].sort((x,y)=>['cardinal','fixed','mutable'].indexOf(x)-['cardinal','fixed','mutable'].indexOf(y)).join('-');
  const mp = MOD_PAIR[mk];
  const comp = []; let cs = 0;
  for (const el of Object.keys(ELEM)) {
    if (pA.e[el]<=1 && pB.e[el]>=3) { comp.push(`${nB}เติมธาตุ${ELEM[el].n}ให้${nA} ช่วยงานด้าน${TASKS[el].t}`); cs += 1.5; }
    if (pB.e[el]<=1 && pA.e[el]>=3) { comp.push(`${nA}เติมธาตุ${ELEM[el].n}ให้${nB} ช่วยงานด้าน${TASKS[el].t}`); cs += 1.5; }
  }
  const comm = Math.round(clamp(50 + 6*(sub(['mercury']) + cr[0] - 1), 5, 95));
  const pace = Math.round(clamp(50 + 6*(sub(['mars','saturn']) + pr[0] + mp[0] - 1), 5, 95));
  const trust = Math.round(clamp(50 + 6*(sub(['moon','venus']) - 1), 5, 95));
  const total = Math.round(clamp(50 + 2.6*(list.reduce((s,x)=>s+val(x),0) + cr[0] + pr[0] + mp[0] + cs - 4), 5, 95));
  return {list, total, comm, pace, trust, cr, pr, mp, comp, pA, pB};
}
