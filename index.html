    : `<p class="sub">ไม่มีดาวกุมลัคนา บุคลิกภายนอกของคุณจึงเป็นไปตามราศีลัคนา${signOf(ch.asc).th}เป็นหลัก</p>`;
  if (kM.length) html += `<p><b>ดาวกุมกลางฟ้า</b> ดาวที่อยู่จุดสูงสุดของท้องฟ้าตอนคุณเกิดจะเด่นในเรื่องอาชีพและภาพลักษณ์ในสังคม</p><ul class="hl">${kM.map(x=>`<li><span class="tag n-k">กุมกลางฟ้า</span> <b>${lk('planets','pl-'+x.p.k,x.p.th)}</b> ${mcText(x.p,x.r)}</li>`).join('')}</ul>`;
  const coreAsp = ch.aspects.filter(a=>a.orb<=5 && ['sun','moon','asc'].some(k=>a.p.k===k||a.q.k===k) && !(a.A.c==='conj' && ['asc','mc'].some(k=>a.p.k===k||a.q.k===k))).slice(0,3);
  if (coreAsp.length) html += `<p><b>มุมที่หล่อหลอมตัวตน</b></p><ul class="hl">${coreAsp.map(a=>{const X=aspectText(a); return `<li><span class="tag n-${X.nature}">${NATURE[X.nature]}</span> ${lk('aspects',a.id,`${a.p.th} ${a.A.n} (${a.A.en}) ${a.q.th}`)} ${X.main}</li>`;}).join('')}</ul>`;
  html += `</section>`;

  // จุดเด่นของดวง
  const hi = [];
  ch.stSigns.forEach(st=>{ const S=SIGNS[st.k]; hi.push(`<b>สเตเลียมในราศี${S.th}</b> ${st.ps.map(p=>lk('planets','pl-'+p.k,p.th)).join(' ')} รวมกัน ${st.ps.length} ดวง คุณจึงมีความเป็นราศี${S.th}เข้มข้นมาก คือ${S.kw} มากกว่าที่ราศีอาทิตย์บอกไว้`); });
  ch.stHouses.forEach(st=>{ hi.push(`<b>สเตเลียมในเรือน ${st.k} (${HOUSES[st.k-1].t})</b> ${st.ps.map(p=>lk('planets','pl-'+p.k,p.th)).join(' ')} รวมกันในเรือนนี้ ชีวิตคุณจึงทุ่มพลังกับ${H_VIA[st.k-1]}เป็นพิเศษ ${lk('houses','ho-'+st.k,'อ่านเรือนนี้')}`); });
  if (ch.asc!=null) {
    const angs = [];
    kA.forEach(x=>angs.push({p:x.p,l:'กุมลัคนา'})); kM.forEach(x=>angs.push({p:x.p,l:'กุมกลางฟ้า'}));
    PLANETS.filter(p=>!NODE_KEYS.includes(p.k)).forEach(p=>{
      [['ใกล้จุดตก (DC)',ch.asc+180],['ใกล้จุดฟ้าต่ำ (IC)',ch.mc+180]].forEach(([l,v])=>{ if (sep(L[p.k],v)<=8) angs.push({p,l}); });
    });
    if (angs.length) hi.push(`<b>ดาวบนมุมหลักของดวง</b> ${angs.map(x=>`${lk('planets','pl-'+x.p.k,x.p.th)}${x.l}`).join(', ')} ดาวที่อยู่ใกล้มุมหลักมีพลังเด่นมาก แสดงออกชัดในบุคลิกและเหตุการณ์ชีวิต`);
  }
  const els = {fire:0,earth:0,air:0,water:0}; PLANETS.filter(p=>!NODE_KEYS.includes(p.k)).forEach(p=>els[signOf(L[p.k]).el]++);
  const eMax = Math.max(...Object.values(els)), eTop = Object.keys(els).filter(k=>els[k]===eMax);
  hi.push(`<b>ธาตุเด่น: ${eTop.map(k=>'ธาตุ'+ELEM[k].n).join(' และ ')}</b> คุณจึงเป็นคน${eTop.map(k=>ELEM[k].d).join(' และ')}`);
  if (ch.cusps) {
    const cnt = Array(12).fill(0); PLANETS.filter(p=>!NODE_KEYS.includes(p.k)).forEach(p=>cnt[hk(p.k)-1]++);
    const mx = Math.max(...cnt), top = cnt.map((c,i)=>[c,i]).filter(x=>x[0]===mx && mx>=2).map(x=>x[1]+1);
    if (top.length && !ch.stHouses.length) hi.push(`<b>เรือนที่มีดาวมากที่สุด</b> ${top.map(h=>`${lk('houses','ho-'+h,`เรือน ${h} ${HOUSES[h-1].t}`)}`).join(' และ ')} เป็นเรื่องที่ชีวิตให้น้ำหนักมาก`);
  }
  if (!ch.stSigns.length && !ch.stHouses.length) hi.push(`<b>ไม่มีสเตเลียม</b> ไม่มีดาว 3 ดวงขึ้นไปรวมกันในราศีหรือเรือนเดียว พลังของคุณจึงกระจายไปหลายด้าน เป็นคนรอบด้านมากกว่าเจาะลึกเรื่องเดียว`);
  { const wp = workProfile(ch); hi.push(`<b>สไตล์การทำงาน: ${soloLabel(wp.pct)}</b> บทบาทเด่นในทีมคือ${ROLE_EL[wp.el].n} ${lk('work','work-top','ดูการทำงานและความเข้ากัน')}`); }
  html += `<section class="sec"><h3>จุดเด่นของดวง</h3><ul class="hl">${hi.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;

  // จุดแข็ง
  const strong = [];
  PLANETS.forEach(p=>{ const d = dignity(p.k, L[p.k]); if (d && DT[d].good) strong.push(`${lk('planets','pl-'+p.k,p.th)} ${DT[d].n} ในราศี${signOf(L[p.k]).th} ด้าน${p.theme}ของคุณจึงทำงานได้ดีเป็นธรรมชาติ`); });
  ch.aspects.filter(a=>a.orb<=5 && !GEN_STRONG.has(a.p.k+'-'+a.q.k) && aspectText(a).nature==='e').slice(0,4)
    .forEach(a=>strong.push(`${lk('aspects',a.id,`${a.p.th} ${a.A.n} (${a.A.en}) ${a.q.th}`)} ${aspectText(a).main}`));
  if (ch.cusps) HR.filter(R=>R.rh===R.h).forEach(R=>strong.push(`เจ้าเรือน ${R.h} (${PK[R.r].th}) อยู่ในเรือนตัวเอง เรื่อง${HOUSES[R.h-1].t}จึงมั่นคงและพึ่งตัวเองได้`));
  html += `<section class="sec"><h3>จุดแข็ง</h3>${strong.length?`<ul class="hl good">${strong.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="sub">ไม่มีตำแหน่งที่โดดเด่นเป็นพิเศษ จุดแข็งของคุณกระจายอยู่ในหลายด้านตามที่อ่านในแท็บอื่น</p>'}</section>`;

  // จุดอ่อน
  const weak = [];
  PLANETS.forEach(p=>{ const d = dignity(p.k, L[p.k]); if (d && !DT[d].good) weak.push(`${lk('planets','pl-'+p.k,p.th)} ${DT[d].n} ในราศี${signOf(L[p.k]).th} ด้าน${p.theme}อาจรู้สึกไม่ลงตัวและต้องใช้ความพยายามมากกว่าคนอื่น`); });
  Object.keys(els).filter(k=>els[k]===0).forEach(k=>weak.push(`ไม่มีดาวในธาตุ${ELEM[k].n} ด้านที่${ELEM[k].d}อาจไม่ใช่สิ่งที่คุณทำได้เองโดยธรรมชาติ ต้องตั้งใจฝึกหรือหาคนที่มีด้านนี้มาช่วย`));
  Object.keys(els).filter(k=>els[k]>=5).forEach(k=>weak.push(`ธาตุ${ELEM[k].n}มากเป็นพิเศษ (${els[k]} ดวง) จุดแข็งนี้อาจกลายเป็นจุดอ่อนได้ถ้าใช้มากเกินไป ควรหาสมดุลกับธาตุอื่น`));

  // โอกาส
  const opp = [];
  const jh = hk('jupiter'), js = signOf(L.jupiter);
  opp.push(`${lk('planets','pl-jupiter','ดาวพฤหัส')}ในราศี${js.th}${jh?` เรือน ${jh}`:''} ${psText('jupiter', L.jupiter)}${jh?` ${PH.jupiter[jh-1]}`:''}`);
  const nh = hk('node'); opp.push(`${lk('planets','pl-node','โหนดเหนือ')}ในราศี${signOf(L.node).th}${nh?` เรือน ${nh} ${PH.node[nh-1]}`:` ชีวิตชวนให้คุณเติบโตไปเป็นคน${signOf(L.node).style}`}`);
  { const sh2 = hk('snode'); opp.push(`${lk('planets','pl-snode','โหนดใต้')}ในราศี${signOf(L.snode).th}${sh2?` เรือน ${sh2} ${PH.snode[sh2-1]}`:` สิ่งที่คุณถนัดมาแต่เดิมคือการเป็นคน${signOf(L.snode).style}`} ใช้ความถนัดนี้เป็นฐาน แล้วก้าวไปทางโหนดเหนือ`); }
  ch.aspects.filter(a=>['jupiter','venus'].some(k=>a.p.k===k||a.q.k===k) && a.orb<=6 && aspectText(a).nature==='e' && !GEN_MILD.has(a.p.k+'-'+a.q.k)).slice(0,2)
    .forEach(a=>opp.push(`${lk('aspects',a.id,`${a.p.th} ${a.A.n} (${a.A.en}) ${a.q.th}`)} ${aspectText(a).main}`));
  html += `<section class="sec"><h3>โอกาส</h3><ul class="hl good">${opp.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;

  // ความท้าทาย
  const ch2 = [];
  const sh = hk('saturn'), ss = signOf(L.saturn);
  ch2.push(`${lk('planets','pl-saturn','ดาวเสาร์')}ในราศี${ss.th}${sh?` เรือน ${sh}`:''} ${psText('saturn', L.saturn)}${sh?` ${PH.saturn[sh-1]}`:''}`);
  ch.aspects.filter(a=>a.orb<=5 && !GEN_STRONG.has(a.p.k+'-'+a.q.k) && aspectText(a).nature==='h').slice(0,4)
    .forEach(a=>ch2.push(`${lk('aspects',a.id,`${a.p.th} ${a.A.n} (${a.A.en}) ${a.q.th}`)} ${aspectText(a).main}`));
  html += `<section class="sec"><h3>ความท้าทายและบทเรียน</h3><ul class="hl bad">${ch2.map(x=>`<li>${x}</li>`).join('')}</ul><p class="sub">ความท้าทายในดวงไม่ใช่เรื่องร้าย แต่เป็นจุดที่ชีวิตผลักให้คุณเติบโต คนจำนวนมากพบว่าจุดเหล่านี้กลายเป็นจุดแข็งที่สุดเมื่ออายุมากขึ้น</p></section>`;

  $('p-summary').innerHTML = html;
}

function renderAspects(inp, ch) {
  let html = `<p class="intro">มุมคือระยะห่างระหว่างดาวสองดวงบนวงดวง บางระยะทำให้พลังของสองดาวช่วยกัน บางระยะทำให้ขัดกัน ความหมายจึงขึ้นกับทั้งชนิดของมุมและคู่ดาว เช่น มุมร่วม (Conjunction) ของดาวศุกร์กับดาวพฤหัสมักเป็นผลดี แต่มุมร่วมของดวงอาทิตย์กับดาวเสาร์เป็นบทเรียนที่ต้องใช้เวลา ตัวเลข <b>คลาด</b> ยิ่งน้อย มุมยิ่งชัดและมีผลมาก</p>`;
  html += `<div class="legend">${ASPECTS.map(A=>`<div class="c-${A.c}"><b>${A.n} (${A.en}) ${A.a}°</b> ${A.kind}<br>${A.d}</div>`).join('')}</div>`;
  if (!ch.aspects.length) { $('p-aspects').innerHTML = html + '<p class="empty">ไม่พบมุมหลักในดวงนี้</p>'; return; }
  html += '<div class="list">';
  for (const a of ch.aspects) {
    const strength = a.orb < 2 ? 'ชัดมาก' : a.orb < 5 ? 'ชัด' : 'มีผลเบา ๆ';
    const X = aspectText(a);

    const body = `${X.html}<p>มุมนี้คลาด ${a.orb.toFixed(1)}° ถือว่า${strength}</p>`;
    html += item(a.id, sum, body);
  }
  $('p-aspects').innerHTML = html + '</div>';
}

const W_PL = {sun:3,moon:2,mercury:1.5,venus:1,mars:2,jupiter:1,saturn:1,uranus:.5,neptune:.5,pluto:.5};
const H_TEAM = [-2,-.5,1,-.5,.5,-.5,2,-.5,0,0,2,-1.5];
const S_TEAM = [-1,-.5,1,.5,.5,-1,1.5,-1,0,-.5,1,.5];
function elemCount(ch) {
  const e = {fire:0,earth:0,air:0,water:0}, m = {cardinal:0,fixed:0,mutable:0};
  PLANETS.filter(p=>!NODE_KEYS.includes(p.k)).forEach(p=>{ const s=signOf(ch.lons[p.k]); e[s.el]++; m[s.mod]++; });
  if (ch.asc!=null) { const s=signOf(ch.asc); e[s.el]++; m[s.mod]++; }
  return {e, m};
}
const topKey = o => Object.keys(o).sort((a,b)=>o[b]-o[a])[0];
function workProfile(ch) {
  const f = []; let sum = 0;
  for (const p of PLANETS) {
    if (NODE_KEYS.includes(p.k)) continue;
    const w = W_PL[p.k]*0.6, l = ch.lons[p.k], si = Math.floor(norm(l)/30);
    const sv = S_TEAM[si]*w; sum += sv;
    if (Math.abs(sv) >= 0.9) f.push({v:sv, t:`${p.th}ในราศี${SIGNS[si].th}`});
    if (ch.cusps) { const h = ch.houseOf(l), hv = H_TEAM[h-1]*w; sum += hv; if (Math.abs(hv) >= 0.9) f.push({v:hv, t:`${p.th}ในเรือน ${h} (${HOUSES[h-1].t})`}); }
  }
  if (ch.asc!=null) {
    const si = Math.floor(norm(ch.asc)/30), v = S_TEAM[si]*1.2; sum += v;
    if (Math.abs(v) >= 0.9) f.push({v, t:`ลัคนาราศี${SIGNS[si].th}`});
    let east=0, west=0; PLANETS.filter(p=>!NODE_KEYS.includes(p.k)).forEach(p=>{ const h=ch.houseOf(ch.lons[p.k]); if (h>=4&&h<=9) west++; else east++; });
    const hv = (west-east)*0.35; sum += hv;
    if (Math.abs(west-east) >= 4) f.push({v:hv, t: west>east ? `ดาวส่วนใหญ่ (${west} ดวง) อยู่ซีกตะวันตกของดวง ซึ่งเป็นซีกของผู้อื่น` : `ดาวส่วนใหญ่ (${east} ดวง) อยู่ซีกตะวันออกของดวง ซึ่งเป็นซีกของตัวเอง`});
  }
  const scale = ch.cusps ? 9 : 5;
  const pct = Math.round(Math.max(3, Math.min(97, 50 + 50*Math.tanh((sum - (ch.cusps ? 1.2 : 0.6))/scale))));
  const {e, m} = elemCount(ch);
  return {pct, f, e, m, el:topKey(e), mod:topKey(m)};
}

function synastry(A, B, nA, nB) {
  const list = [];
  for (const a of SYN_SET) for (const b of SYN_SET) {
    const s = sep(A.lons[a], B.lons[b]);
    for (const asp of ASPECTS) {
      const orb = Math.abs(s-asp.a); if (orb > SYN_ORB[asp.a]) continue;
      const ia = SYN_SET.indexOf(a), ib = SYN_SET.indexOf(b), fwd = ia<=ib;
      const T = SYN[fwd ? a+'-'+b : b+'-'+a], first = fwd ? nA : nB, second = fwd ? nB : nA;
      const nature = asp.c==='conj' ? T[0] : asp.c==='harm' ? 'e' : 'h';
      const txt = (asp.c==='conj' ? T[3] : asp.c==='harm' ? T[1] : T[2]).replaceAll('{1}', first).replaceAll('{2}', second);
      const w = (SYN_W[a]+SYN_W[b])/2 * (1 - orb/(SYN_ORB[asp.a]+1));
      list.push({a, b, asp, orb, nature, txt, w});
    }
  }
  list.sort((x,y)=>y.w-x.w);
  const val = x => x.w * (x.nature==='e' ? 1 : x.nature==='h' ? -0.85 : 0.35);
  const sub = keys => list.filter(x=>keys.includes(x.a)||keys.includes(x.b)).reduce((s,x)=>s+val(x),0);
  const pA = workProfile(A), pB = workProfile(B);
  const cr = COMM_REL[elRel(signOf(A.lons.mercury).el, signOf(B.lons.mercury).el)];
  const pr = PACE_REL[elRel(signOf(A.lons.mars).el, signOf(B.lons.mars).el)];
  const mk = [pA.mod, pB.mod].sort((x,y)=>['cardinal','fixed','mutable'].indexOf(x)-['cardinal','fixed','mutable'].indexOf(y)).join('-');
  const mp = MOD_PAIR[mk];
  const comp = []; let cs = 0;
  for (const el of Object.keys(ELEM)) {
    if (pA.e[el]<=1 && pB.e[el]>=3) { comp.push(`${nB}เติมธาตุ${ELEM[el].n}ให้${nA} ช่วยงานด้าน${TASKS[el].t}`); cs += 1.5; }
    if (pB.e[el]<=1 && pA.e[el]>=3) { comp.push(`${nA}เติมธาตุ${ELEM[el].n}ให้${nB} ช่วยงานด้าน${TASKS[el].t}`); cs += 1.5; }
  }
  const comm = Math.round(clamp(50 + 6*(sub(['mercury']) + cr[0] - 1), 5, 95));
  const pace = Math.round(clamp(50 + 6*(sub(['mars','saturn']) + pr[0] + mp[0] - 1), 5, 95));
  const trust = Math.round(clamp(50 + 6*(sub(['moon','venus']) - 1), 5, 95));
  const total = Math.round(clamp(50 + 2.6*(list.reduce((s,x)=>s+val(x),0) + cr[0] + pr[0] + mp[0] + cs - 4), 5, 95));
  return {list, total, comm, pace, trust, cr, pr, mp, comp, pA, pB};
}

function memberError(o) {

let CUR = null;
document.addEventListener('submit', e=>{
  if (e.target.id !== 'mf') return;
  e.preventDefault();
  const o = {name:$('m-name').value.trim().replace(/[<>&"]/g,''), day:$('m-day').value, month:$('m-month').value, year:$('m-year').value, hour:$('m-hour').value, minute:$('m-minute').value, notime:$('m-notime').checked, place:$('m-place').value};
  const err = memberError(o); if (err) { $('m-err').textContent = err; return; }
  TEAM.push(o); saveTeam(); renderWork(CUR.inp, CUR.ch); openItem('work', 'mb-'+(TEAM.length-1));
});
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-remove]'); if (!b) return;

});

function elLove(x, y) { const r = elRel(x,y); if (r!=='diff') return {s: r==='same'?1.5:1.2, t:EL_LOVE[r]}; const ord=['fire','earth','air','water']; const k=[x,y].sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)).join('-'); return {s:-0.8, t:EL_LOVE[k]}; }

function loveSynastry(A, B, nA, nB) {
  const L = (ch,k) => k==='asc' ? ch.asc : ch.lons[k];
  const list = [];
  for (const a of LOVE_SET) for (const b of LOVE_SET) {
    const la = L(A,a), lb = L(B,b); if (la==null || lb==null) continue;
    const s = sep(la, lb);
    for (const asp of ASPECTS) {
      const orb = Math.abs(s-asp.a); if (orb > LOVE_ORB[asp.a]) continue;
      const ia = LOVE_SET.indexOf(a), ib = LOVE_SET.indexOf(b), fwd = ia<=ib;
      const T = LOVE[fwd ? a+'-'+b : b+'-'+a], first = fwd ? nA : nB, second = fwd ? nB : nA;
      const nature = asp.c==='conj' ? T[0] : asp.c==='harm' ? 'e' : 'h';
      const fill = x => x.replaceAll('{1}', first).replaceAll('{2}', second);
      const txt = fill(asp.c==='conj' ? T[3] : asp.c==='harm' ? T[1] : T[2]);
      const w = (LOVE_W[a]+LOVE_W[b])/2 * (1 - orb/(LOVE_ORB[asp.a]+1));
      list.push({a, b, asp, orb, nature, txt, tip:fill(T[4]), w});
    }
  }
  list.sort((x,y)=>y.w-x.w);
  const val = x => x.w * (x.nature==='e' ? 1 : x.nature==='h' ? -0.85 : 0.35);
  const sub = keys => list.filter(x=>keys.includes(x.a)||keys.includes(x.b)).reduce((s,x)=>s+val(x),0);
  const E = k => signOf(A.lons[k]).el, F = k => signOf(B.lons[k]).el;
  const sunR = elLove(E('sun'), F('sun')), moonR = elLove(E('moon'), F('moon')), merR = elLove(E('mercury'), F('mercury'));
  const longT = list.filter(x=>x.a==='saturn'||x.b==='saturn'||(x.a==='sun'&&x.b==='moon')||(x.a==='moon'&&x.b==='sun')).reduce((s,x)=>s + x.w*(x.nature==='e'?1:x.nature==='h'?-0.4:0.6), 0);
  const attract = Math.round(clamp(50 + 5*(sub(['venus','mars','asc']) - 1.5), 5, 95));
  const emo = Math.round(clamp(50 + 5*(sub(['moon']) + moonR.s - 1.2), 5, 95));
  const talk = Math.round(clamp(50 + 6*(sub(['mercury']) + merR.s - 1), 5, 95));
  const stable = Math.round(clamp(50 + 8*(longT - 1), 5, 95));
  const total = Math.round(clamp(50 + 2.2*(list.reduce((s,x)=>s+val(x),0) + sunR.s + moonR.s - 3.3), 5, 95));
  return {list, total, attract, emo, talk, stable, sunR, moonR, merR};

function teamChartHTML(rows) {

      html += `<ul class="hl"><li><b>ดาวพฤหัสกำลังผ่านเรือน ${hj} (${HOUSES[hj-1].t})</b> โอกาสและการเติบโตช่วงนี้มาจาก${H_VIA[hj-1]}</li><li><b>ดาวเสาร์กำลังผ่านเรือน ${hs} (${HOUSES[hs-1].t})</b> บทเรียนและความรับผิดชอบช่วงนี้อยู่ที่${H_VIA[hs-1]} ความพยายามด้านนี้จะให้ผลระยะยาว</li></ul>`; }
    html += `</section>`;
  }
  // ดาวถอยหลัง
  const rx = RX_SET.filter(k=>sp[k] < 0);
  html += `<section class="sec"><h3>ดาวที่กำลังถอยหลัง</h3>`;
  html += rx.length ? `<ul class="hl bad">${rx.map(k=>{ const h = ch.cusps ? ch.houseOf(T[k]) : null; const outer = ['uranus','neptune','pluto'].includes(k);
    return `<li><b>${PK[k].th}ถอยหลัง (Retrograde) ในราศี${signOf(T[k]).th}</b> ${RX_TXT[k]}${h?` ในดวงของคุณ ดาวนี้ถอยหลังในเรือน ${h} เรื่อง${HOUSES[h-1].t}จึงได้รับผลมากที่สุด`:''}${outer?' (ดาวดวงนี้ถอยหลังทุกปีนานหลายเดือน ผลจึงไม่รุนแรง)':''}</li>`; }).join('')}</ul>` : '<p class="sub">ช่วงนี้ไม่มีดาวดวงไหนถอยหลัง</p>';
  const rp = rxPeriods(ms);
  html += `<p class="k2">รอบถอยหลังของดาวเคลื่อนเร็ว</p><ul class="pl">${['mercury','venus','mars'].map(k=>{ const p = rp[k], f = x => thDate(ms + x*864e5);
    return `<li><b>${PK[k].th}</b> ${p.cur ? `กำลังถอยหลัง ${f(p.cur[0])} ถึง ${f(p.cur[1])}` : p.next ? `ถอยหลังครั้งถัดไป ${f(p.next[0])} ถึง ${f(p.next[1])}` : 'ไม่ถอยหลังในปีนี้'}</li>`; }).join('')}</ul></section>`;
  // ตารางดาว
  const moonPh = norm(T.moon - T.sun), phase = moonPh<22.5||moonPh>=337.5 ? 'จันทร์ดับ' : moonPh<157.5 ? 'ข้างขึ้น' : moonPh<202.5 ? 'จันทร์เต็มดวง' : 'ข้างแรม';
  html += `<section class="sec"><h3>ตำแหน่งดาวบนท้องฟ้า</h3><p class="sub">ดวงจันทร์อยู่ราศี${signOf(T.moon).th} ช่วง${phase}</p><div class="scroll"><table class="tt"><thead><tr><th>ดาว</th><th>ราศี</th><th>องศา</th><th>ทิศทาง</th>${ch.cusps?'<th>ผ่านเรือนของคุณ</th>':''}</tr></thead><tbody>${PLANETS.map(p=>{ const k = p.k, l = T[k];
    const dir = NODE_KEYS.includes(k) ? 'ถอยหลังตามปกติ' : ['sun','moon'].includes(k) ? 'เดินหน้า' : Math.abs(sp[k]) < (STAT_TH[k]||0) ? 'เกือบหยุดนิ่ง' : sp[k] < 0 ? '<span class="rx">Rx</span> ถอยหลัง' : 'เดินหน้า';
    return `<tr><td><span class="sg">${p.g}</span> ${p.th}</td><td><span class="sg">${signOf(l).g}</span> ${signOf(l).th}</td><td class="num">${degStr(l)}</td><td>${dir}</td>${ch.cusps?`<td class="num">${ch.houseOf(l)}</td>`:''}</tr>`; }).join('')}</tbody></table></div></section>`;
  $('p-now').innerHTML = html;
  $('nowDate').addEventListener('change', e=>{ NOW_DATE = e.target.value || null; renderNow(CUR.inp, CUR.ch); });
}
document.addEventListener('click', e=>{ if (!e.target.closest('[data-nowreset]')) return; NOW_DATE = null; renderNow(CUR.inp, CUR.ch); });

/* ดัชนีความง่ายในการมีแฟน */
const LE_NORM = {t:[0.776,1.698], n:[0.149,1.134]};
function loveEaseRaw(ch) {
  const L = ch.lons, f = [], add = (v,t) => f.push({v,t});
  const vs = signOf(L.venus), vd = dignity('venus', L.venus);
  if (vd==='dom'||vd==='ex') add(1.2, `ดาวศุกร์${DT[vd].n} ในราศี${vs.th} เสน่ห์และความรักของคุณทำงานได้เต็มที่`);
  if (vd==='det'||vd==='fall') add(-1, `ดาวศุกร์${DT[vd].n} ในราศี${vs.th} คุณอาจเลือกมาก เปิดใจช้า หรือแสดงความรักไม่ถนัด`);
  if (ch.cusps) {
    const hv = ch.houseOf(L.venus);
    if ([1,5,7,11].includes(hv)) add(1, `ดาวศุกร์อยู่เรือน ${hv} (${HOUSES[hv-1].t}) เสน่ห์ของคุณเห็นได้ชัดในชีวิตประจำวัน`);
    if ([6,8,12].includes(hv)) add(-.6, `ดาวศุกร์อยู่เรือน ${hv} (${HOUSES[hv-1].t}) ความรักมักเริ่มแบบเงียบ ๆ หรือต้องใช้เวลา`);
    const V7 = {venus:1.2, jupiter:1.2, moon:.8, sun:.6, saturn:-1, uranus:-.6, pluto:-.4, neptune:-.3};
    const R7 = {saturn:'ความรักจริงจังมักมาช้า แต่เมื่อมาแล้วมั่นคง', uranus:'ความสัมพันธ์มาแบบไม่คาดฝันแต่ไม่ค่อยมั่นคง', pluto:'ความสัมพันธ์เข้มข้นและซับซ้อน', neptune:'อาจมองคู่ในอุดมคติจนเลือกยาก'};
    PLANETS.filter(p=>V7[p.k] && ch.houseOf(L[p.k])===7).forEach(p=>add(V7[p.k], `${p.th}อยู่ในเรือนคู่ครอง ${V7[p.k]>0 ? 'ดึงดูดความสัมพันธ์เข้ามาได้ง่าย' : R7[p.k]}`));
    PLANETS.filter(p=>['venus','jupiter','moon'].includes(p.k) && ch.houseOf(L[p.k])===5).forEach(p=>add(.6, `${p.th}อยู่ในเรือนความรัก ชอบการเดตและเปิดรับความรักง่าย`));
    const d7 = Math.floor(norm(ch.cusps[6])/30), r7 = RULER[d7], h7 = ch.houseOf(L[r7]);
    if ([1,5,7,10,11].includes(h7)) add(.5, `เจ้าเรือนคู่ครอง (${PK[r7].th}) อยู่เรือน ${h7} ความรักเชื่อมกับชีวิตประจำวันของคุณโดยตรง`);
    if ([6,8,12].includes(h7)) add(-.5, `เจ้าเรือนคู่ครอง (${PK[r7].th}) อยู่เรือน ${h7} ความรักมักเกิดในที่ที่ไม่คาดคิดหรือต้องใช้เวลา`);
    const ai = Math.floor(norm(ch.asc)/30);
    if ([1,4,6].includes(ai)) add(.6, `ลัคนาราศี${SIGNS[ai].th} มีเสน่ห์ที่คนสังเกตเห็นตั้งแต่แรกพบ`);
    if ([7,9].includes(ai)) add(-.3, `ลัคนาราศี${SIGNS[ai].th} ภายนอกดูเข้าถึงยาก คนอาจไม่กล้าเข้าหาก่อน`);
  }
  const has = (a,b,f2) => ch.aspects.find(x=>((x.p.k===a&&x.q.k===b)||(x.p.k===b&&x.q.k===a)) && f2(x));
  const hard = x => x.A.c==='tense' || x.A.c==='conj', soft = x => x.A.c!=='tense';
  if (has('venus','jupiter',()=>true)) add(1, 'ดาวศุกร์ทำมุมกับดาวพฤหัส ใจกว้าง มีเสน่ห์ และมักมีโชคเรื่องความรัก');
  if (has('venus','mars',soft)) add(.8, 'ดาวศุกร์กับดาวอังคารส่งเสริมกัน มีแรงดึงดูดทางเพศตรงข้ามหรือคนที่สนใจสูง');
  if (has('venus','saturn',hard)) add(-.9, 'ดาวศุกร์ถูกดาวเสาร์กดดัน ระวังตัวในความรัก กลัวถูกปฏิเสธ หรือความรักมาช้า');
  if (has('venus','uranus',x=>x.A.c==='tense')) add(-.5, 'ดาวศุกร์ทำมุมท้าทายกับดาวยูเรนัส รักอิสระจนความสัมพันธ์ไม่ค่อยยืด');
  if (has('venus','pluto',x=>x.A.c==='tense')) add(-.4, 'ดาวศุกร์ทำมุมท้าทายกับดาวพลูโต ความรักเข้มข้นจนเหนื่อยหรือกลัวการผูกพัน');
  if (has('moon','saturn',hard)) add(-.6, 'ดวงจันทร์ถูกดาวเสาร์กดดัน เปิดใจยากและไม่ค่อยแสดงความรู้สึก');
  if (has('moon','venus',soft)) add(.5, 'ดวงจันทร์กับดาวศุกร์ส่งเสริมกัน อ่อนโยนและน่ารักในสายตาคนอื่น');
  const wp = workProfile(ch).pct, sv = (wp-50)/50;
  if (sv > 0.25) add(sv*.8, 'ชอบเข้าสังคมและพบคนใหม่ โอกาสรู้จักคนจึงมาก');
  if (sv < -0.25) add(sv*.8, 'ชอบอยู่กับตัวเองหรือกลุ่มเล็ก ๆ โอกาสพบคนใหม่จึงน้อยกว่า');
  return {sum: f.reduce((a,b)=>a+b.v,0), f};
}
function loveEase(ch) {
  const r = loveEaseRaw(ch), N = LE_NORM[ch.cusps ? 't' : 'n'];
  const pct = Math.round(clamp(50 + 16*(N ? (r.sum - N[0])/N[1] : 0), 8, 95));
  return {pct, f:r.f};
}
const easeLabel = p => p>=75 ? 'มีแฟนได้ง่าย' : p>=60 ? 'ค่อนข้างง่าย' : p>=45 ? 'ปานกลาง' : p>=30 ? 'ต้องใช้เวลา' : 'ต้องตั้งใจมาก';
function easeHTML(inp, ch) {
  const E = loveEase(ch), pos = E.f.filter(x=>x.v>0).sort((a,b)=>b.v-a.v), neg = E.f.filter(x=>x.v<0).sort((a,b)=>a.v-b.v);
  let soon = '';
  if (LIFE) { const now = Math.max(0, Math.floor((Date.now()-inp.ms)/YR)), yrs = [];
    for (let a = now; a <= Math.min(now+5, LIFE.Y-1); a++) if (LIFE.val.love[a] >= 60) yrs.push(a);
    soon = yrs.length ? `<p><b>ช่วงที่โอกาสความรักเด่นใน 5 ปีข้างหน้า</b> ${yrs.map(a=>`พ.ศ. ${beYear(inp,a)}`).join(' ')} ${lk('life','life-top','ดูกราฟชีวิต')}</p>` : `<p class="sub">ใน 5 ปีข้างหน้ายังไม่มีช่วงที่ดาวส่งเสริมความรักเด่นเป็นพิเศษ ความรักจึงขึ้นกับการออกไปพบคนมากกว่าจังหวะดาว</p>`; }
  return `<section class="sec" id="ease"><h3>ความง่ายในการมีแฟน</h3><div class="love-head"><div class="love-score"><span class="num">${E.pct}%</span><span class="tag n-${E.pct>=60?'e':E.pct>=45?'m':'h'}">${easeLabel(E.pct)}</span></div><div class="ease-bar"><span class="t"><i style="width:${E.pct}%"></i></span><p class="sub" style="margin:6px 0 0">เทียบกับดวงของคนทั่วไป 50% คือระดับเฉลี่ย ไม่ใช่ความน่าจะเป็นทางสถิติ</p></div></div>
    <div class="split" style="margin-top:12px"><div><p class="k2">ทำไมถึงง่าย</p>${pos.length?`<ul class="hl good">${pos.map(x=>`<li>${x.t}</li>`).join('')}</ul>`:'<p class="sub">ไม่มีปัจจัยเด่นที่ทำให้ง่ายเป็นพิเศษ</p>'}</div><div><p class="k2">ทำไมถึงต้องใช้เวลา</p>${neg.length?`<ul class="hl bad">${neg.map(x=>`<li>${x.t}</li>`).join('')}</ul>`:'<p class="sub">ไม่มีปัจจัยที่ทำให้ยากเป็นพิเศษ</p>'}</div></div>${soon}</section>`;
}

function render(inp, ch) {
  CUR = {inp, ch};
  const dtf = new Intl.DateTimeFormat('th-TH',{dateStyle:'long',...(inp.timeKnown?{timeStyle:'short'}:{}),timeZone:'UTC'});
  const localShown = dtf.format(new Date(inp.ms + inp.off*60000));
  $('cTitle').textContent = inp.title;
  $('cSub').textContent = inp.sub || `${localShown}${inp.timeKnown?' น.':' (ไม่ทราบเวลาเกิด คำนวณที่เที่ยงวัน)'} ที่${inp.placeName} (${fmtOff(inp.off)})`;
  drawWheel(ch);
  renderOverview(inp, ch); renderPlanets(inp, ch); renderHouses(inp, ch); renderAspects(inp, ch); renderWork(inp, ch); renderLife(inp, ch); renderNow(inp, ch); renderLove(inp, ch); renderSummary(inp, ch);
  const notes = [];
  if (ch.houseNote) notes.push(ch.houseNote);
  notes.push('ใช้ระบบราศีแบบตะวันตก (Tropical) ตำแหน่งดาวคำนวณในเบราว์เซอร์ของคุณ ไม่มีการส่งข้อมูลออกไป ความคลาดเคลื่อนราว 1 ถึง 2 ลิปดา ใช้ได้กับปีเกิด ค.ศ. 1800 ถึง 2100 คำอธิบายเป็นความหมายทั่วไปเพื่อการเรียนรู้และความบันเทิง');
  $('note').textContent = notes.join(' ');
}

/* ---------- input handling ---------- */
function readForm() {
  const d = +$('day').value, mo = +$('month').value; let y = +$('year').value;
  const timeKnown = !$('notime').checked;
  const h = timeKnown ? +$('hour').value : 12, mi = timeKnown ? +($('minute').value||0) : 0;
  if (!d || !mo || !y) return {error:'กรอกวัน เดือน และปีเกิดให้ครบ'};
  if (y > 2300) y -= 543;
  if (y < 1800 || y > 2100) return {error:'ปีเกิดต้องอยู่ระหว่าง ค.ศ. 1800 ถึง 2100 (พ.ศ. 2343 ถึง 2643)'};
  const leap = y%4===0 && (y%100!==0 || y%400===0);
  const dim = [31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];
  if (d<1 || d>dim) return {error:`เดือน${MONTHS[mo-1]}ปีนั้นมี ${dim} วัน ตรวจวันเกิดอีกครั้ง`};
  if (timeKnown && ($('hour').value==='' || h<0 || h>23 || mi<0 || mi>59)) return {error:'กรอกเวลาเกิด (ชั่วโมง 0 ถึง 23) หรือเลือก ไม่ทราบเวลาเกิด'};
  let loc;
  if ($('place').value === 'custom') {
    const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
    if (isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return {error:'กรอกละติจูด (−90 ถึง 90) และลองจิจูด (−180 ถึง 180)'};
    loc = {n:`พิกัด ${lat.toFixed(3)}, ${lon.toFixed(3)}`, lat, lon, tz:null, off:+$('utcoff').value*60};
  } else loc = PLACES[+$('place').value];
  const {ms, off} = localToUTC(y,mo,d,h,mi,loc);
  const name = $('name').value.trim();
  return { ms, off, lat:loc.lat, lon:loc.lon, timeKnown, placeName:loc.n, houses:$('houses').value,
    title: name ? `ดวงกำเนิดของ${name}` : 'ดวงกำเนิดของคุณ' };
}
const FIELDS = ['name','day','month','year','hour','minute','place','lat','lon','utcoff','houses'];
function save() { try { const o={}; FIELDS.forEach(f=>o[f]=$(f).value); o.notime=$('notime').checked; localStorage.setItem('birthchart:last', JSON.stringify(o)); } catch(e) {} }
function restore() {
  try {
    const o = JSON.parse(localStorage.getItem('birthchart:last')||'null'); if (!o) return false;
    FIELDS.forEach(f=>{ if (o[f]!=null && o[f]!=='') $(f).value=o[f]; });
    $('notime').checked = !!o.notime; $('notime').dispatchEvent(new Event('change')); $('place').dispatchEvent(new Event('change'));
    return true;
  } catch(e) { return false; }
}
function showNow() {
  const now = Date.now(), loc = TH[0];
  const inp = { ms:now, off:tzOffsetMin(loc.tz, now), lat:loc.lat, lon:loc.lon, timeKnown:true, placeName:loc.n, houses:$('houses').value,
    title:'ท้องฟ้าขณะนี้เหนือกรุงเทพฯ', sub:'ตัวอย่างดวง ณ เวลาปัจจุบัน กรอกข้อมูลเกิดเพื่อดูดวงของคุณเอง' };
  render(inp, compute(inp));
}
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const inp = readForm();
  if (inp.error) { $('err').textContent = inp.error; return; }
  $('err').textContent = '';
  render(inp, compute(inp)); save(); selectTab('overview');
  if (window.matchMedia('(max-width:860px)').matches) $('out').scrollIntoView({behavior: reduceMotion?'auto':'smooth'});
});
$('houses').addEventListener('change', ()=>{ const inp=readForm(); if (!inp.error) { render(inp,compute(inp)); save(); } else showNow(); });

$('place').value = '0';
if (restore()) { const inp = readForm(); inp.error ? showNow() : render(inp, compute(inp)); } else showNow();
</script>
